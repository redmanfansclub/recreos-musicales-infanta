<style>
:root{
  --telon:#8C2643;--telon2:#6F1B33;--oro:#D9A441;--oroc:#F6E6BD;--tinta:#241A1F;--mu:#6E6268;
  --papel:#F1E8EC;--sf:#FFFFFF;--ln:#E4DADF;--mag:#E8006A;--ok:#1E7A4F;--wn:#9A6200;--er:#B42318;
  --acc:#8C2643;--azul:#3B6E99;--prof:#13806E;
  --disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --txt:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{--telon:#5E1529;--telon2:#430E1D;--tinta:#F1EAEE;--mu:#B9AAB2;--papel:#150D11;--sf:#251C21;--ln:#3C2F36;--oroc:#4A3A1C;--ok:#5FCB96;--wn:#E3B04F;--er:#F08A80;--acc:#E7B85A;--azul:#8DB8DE;--prof:#4FC3A8;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--telon:#5E1529;--telon2:#430E1D;--tinta:#F1EAEE;--mu:#B9AAB2;--papel:#150D11;--sf:#251C21;--ln:#3C2F36;--oroc:#4A3A1C;--ok:#5FCB96;--wn:#E3B04F;--er:#F08A80;--acc:#E7B85A;--azul:#8DB8DE;--prof:#4FC3A8;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font:16px/1.5 var(--txt);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
a{color:inherit}
.it{font-style:italic}

/* Cabecera: el telón del salón de actos */
.top{background:var(--telon);color:#FFF6F0;padding:max(20px,env(safe-area-inset-top)) clamp(14px,4vw,32px) 0;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:repeating-linear-gradient(90deg,var(--telon2) 0 18px,var(--telon) 18px 36px);
  -webkit-mask:radial-gradient(18px 10px at 18px 0,#000 98%,transparent) 0 0/36px 10px repeat-x;
          mask:radial-gradient(18px 10px at 18px 0,#000 98%,transparent) 0 0/36px 10px repeat-x}
.brand{display:flex;align-items:center;gap:14px;max-width:1480px;margin:0 auto}
.brand>svg{flex:0 0 auto;width:78px;height:78px}
.brand h1{font:800 clamp(21px,3.2vw,30px)/1.05 var(--disp);margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1 .rmi{font:800 13px/1 var(--disp);letter-spacing:.06em;background:var(--oro);color:#3A1F06;padding:5px 8px;border-radius:7px}
.brand p{margin:3px 0 0;color:var(--oro);font:500 15px/1.2 var(--disp)}
.brand .sp{flex:1}
.brand .by{display:block;font-size:11px;opacity:.6;margin-top:4px;letter-spacing:.02em}
.ed{display:flex;align-items:center;gap:10px;font-size:14px}
.ed select{background:var(--telon2);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 8px}
.est{font-size:13px;color:#F0D3DB;min-width:86px;text-align:right}
.tema{background:var(--telon2);border:1px solid rgba(255,255,255,.3);color:#FFE9B8;border-radius:24px;height:44px;padding:0 16px 0 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:700 15px var(--disp)}
.tema:hover{background:rgba(0,0,0,.25)}
.tema svg{width:22px;height:22px}
nav.tabs{display:flex;gap:2px;max-width:1480px;margin:12px auto 0;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:#F6DCE3;padding:9px 14px 11px;cursor:pointer;font:700 15px var(--disp);border-radius:10px 10px 0 0;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--papel);color:var(--acc)}

main{max-width:1544px;margin:0 auto;padding:30px clamp(14px,4vw,32px) 60px}
h2{font:800 24px/1.15 var(--disp);margin:0 0 4px}
h3{font:700 18px/1.2 var(--disp);margin:0 0 8px}
.mu{color:var(--mu)}
.sm{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px}
.panel+.panel{margin-top:18px}
.grid2>.panel{margin:0}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu);min-width:0}
input[type=text],input[type=url],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  background:var(--sf);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;color:var(--tinta);width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mu) 70%,transparent)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--telon);border-color:var(--telon);color:#fff}
.btn.p:hover{background:var(--telon2)}
.btn.g{border-color:transparent;background:none;color:var(--mu);padding:6px 8px}
.btn.g:hover{color:var(--er)}
.btn:disabled{opacity:.45;cursor:default}
.ico{width:18px;height:18px;flex:0 0 auto}

/* El teclado de días */
.piano{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#1C1216;padding:10px 10px 0;border-radius:16px 16px 10px 10px;margin-bottom:26px}
.key{position:relative;background:#FFFDF8;color:#241A1F;border:0;border-radius:0 0 10px 10px;min-height:118px;padding:40px 10px 12px;text-align:left;cursor:pointer;
  box-shadow:inset 0 -6px 0 #E4DCCB;transition:transform .12s,box-shadow .12s}
.key:hover{background:#FFF8E8}
.key[aria-pressed="true"]{background:#F6E6BD;transform:translateY(3px);box-shadow:inset 0 -2px 0 #CDB57C}
.key .dn{font:700 14px var(--disp);text-transform:capitalize;display:block}
.key .dd{font:800 34px/1 var(--disp);display:block;margin:2px 0 4px}
.key .dm{font-size:13px;color:#6E6268}
.key .dots{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#B9A9B0}
.dot.al{background:#E8006A}.dot.pr{background:#13806E}.dot.gr{background:#3B6E99}.dot.in{background:#C98A12}
.blk{position:absolute;top:10px;width:22px;height:36px;background:#1C1216;border-radius:0 0 5px 5px;transform:translateX(-50%);pointer-events:none}
.key[draggable="true"]{cursor:grab}
.key.arr{opacity:.45}
.key.drop{outline:3px dashed #E8006A;outline-offset:-5px;background:#FFF0F6}
.key .dc{display:block;font:700 12.5px/1.2 var(--disp);color:#8C2643;margin:-1px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 10px;border-radius:20px;border:1px solid #D7C5DD;background:#EFE6F1;color:#4A2B55;cursor:pointer;line-height:1.4}
.mini .ico{width:15px;height:15px}.mini .btn.g{padding:0 2px;color:#7A5A86}
button.mini+button.mini,.drow>button.mini:not(:first-child){background:color-mix(in srgb,var(--mu) 10%,var(--sf));border-color:var(--ln);color:var(--mu)}
.pchip{background:#FBF7FC;border:1px solid #D7C5DD;border-radius:14px;padding:0 9px;font-weight:700;cursor:grab}
.pered{background:#EFE6F1;border:1px solid #D7C5DD;border-radius:12px;padding:12px;color:#4A2B55;margin-top:6px}
.pered .ico{width:16px;height:16px;vertical-align:-3px}
.mont{flex-basis:100%;margin:2px 0 0;padding:8px 12px 8px 28px;font-size:13.5px;color:var(--mu);background:color-mix(in srgb,var(--mu) 7%,var(--sf));border-radius:10px}
:root[data-theme="dark"] .mini,:root[data-theme="dark"] .pered{background:#2B1F31;border-color:#4A3754;color:#E9DCEF}
:root[data-theme="dark"] .pchip{background:#21172A;border-color:#4A3754}

/* Logo: tubos de órgano de Santa Cecilia con los bloques del logo del Infanta y un teclado como base. */
/* Logo: saxofón (magenta del Infanta) y guitarra (oro) sobre un teclado, con los cuadraditos del logo del instituto. */
/* Logo: saxofón (latón) y guitarra (oro) sobre un teclado, con los cuadraditos del logo del instituto. */
function logo(size,cab){
  const X=5,Y=42,Wt=54,H=16,W=Wt/7;let k='';
  for(let j=1;j<7;j++)k+=`<line x1="${(X+j*W).toFixed(2)}" y1="${Y}" x2="${(X+j*W).toFixed(2)}" y2="${Y+H}" stroke="#8C7A80" stroke-width=".7"/>`;
  [1,2,4,5,6].forEach(j=>{k+=`<rect x="${(X+j*W-2.1).toFixed(2)}" y="${Y}" width="4.2" height="${H*0.6}" rx=".6" fill="#1C1216"/>`});
  const fondo=cab?`<rect x=".75" y=".75" width="62.5" height="62.5" rx="13.5" fill="#3E0B1A" stroke="#D9A441" stroke-width="1.5"/>`:`<rect width="64" height="64" rx="14" fill="#8C2643"/>`;

/* ---------- Fechas ---------- */
function lunesSantaCecilia(anio){ // 22 nov entre semana: esa semana; en fin de semana: la anterior
  const d=new Date(anio,10,22),w=d.getDay(),off=w==0?6:w==6?5:w-1;d.setDate(d.getDate()-off);return d}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pD=s=>{const[a,m,d]=String(s).split('-').map(Number);return new Date(a,m-1,d)};
const fechaDia=(E,i)=>{const d=pD(E.datos.inicio);d.setDate(d.getDate()+i);return d};
const may=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fLarga=d=>`${DIAS[(d.getDay()+6)%7]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
function rango(E){const a=fechaDia(E,0),b=fechaDia(E,4);
  return a.getMonth()==b.getMonth()?`Del ${a.getDate()} al ${b.getDate()} de ${MESES[b.getMonth()]} de ${b.getFullYear()}`
  :`Del ${a.getDate()} de ${MESES[a.getMonth()]} al ${b.getDate()} de ${MESES[b.getMonth()]} de ${b.getFullYear()}`}

/* ---------- Cursos: cada uno lo escribe a su manera ("2B", "2.º ESO B", "segundo b") ---------- */
const NIV={'1ESO':'1.º ESO','2ESO':'2.º ESO','3ESO':'3.º ESO','4ESO':'4.º ESO','1BACH':'1.º Bach.','2BACH':'2.º Bach.','FP':'FP'};
const NIVORD=Object.keys(NIV);
function curso(raw){
  let s=String(raw||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[º°ª.]/g,' ').replace(/\s+/g,' ').trim();
  if(!s||/prof|invit/.test(s))return null;
  if(/\bfp\b|\bf p\b|formacion|ciclo|grado|smr|daw|dam|asir/.test(s))return{niv:'FP',l:''};
  s=s.replace(/primero|primer/g,'1').replace(/segundo/g,'2').replace(/tercero|tercer/g,'3').replace(/cuarto/g,'4');
  const bach=/bach|bto|bachiller/.test(s),m=s.match(/[1-4]/);if(!m)return null;const n=+m[0];
  const s2=s.replace(/bachillerato|bachiller|bach|bto|eso/g,' ');
  const lm=s2.match(/[1-4]\s*([a-h])(?![a-z])/)||s2.match(/(?:^|\s)([a-h])(?![a-z])/);
  const l=lm?lm[1].toUpperCase():'';
  if(bach)return n<=2?{niv:n+'BACH',l}:null;
  return{niv:n+'ESO',l};
}
const fmtCurso=g=>{const p=curso(g);return p?NIV[p.niv]+(p.l?' '+p.l:''):String(g||'').trim()};

function normaliza(dt){ // compatibilidad con la primera versión (acts / tipo)
  dt.diploma=dt.diploma||{frase:'Por llenar de música los recreos del instituto en la Semana de Santa Cecilia. Gracias por tu esfuerzo, tu valentía y tu talento.',top:52};
  (dt.dias||[]).forEach(d=>{
    if(d.acts){d.bloques=d.acts.map(a=>Object.assign({t:'al'},a));delete d.acts}
    if(d.tipo){d.no=d.tipo=='no';delete d.tipo}
    d.bloques=d.bloques||[];d.pres=d.pres||[];
    d.bloques.forEach(b=>{if(!b.t)b.t='al';if(b.formato=='acapela'||b.formato=='acapella')b.formato='acappella';if(!b.id)b.id=uid();
      if(b.t=='al'&&(b.formato=='playback'||b.formato=='acappella'||!FMT[b.formato])){ // de «playback / a cappella» a los formatos nuevos
        const ins=[...(b.alumnos||[]).map(u=>u.i||''),b.instr||''].join(' ').toLowerCase(),voz=/voz|voces|cant|vocal/.test(ins),otro=/piano|guitarr|sax|flaut|viol|tromp|clar|bajo|bater|ukel|tecl|chelo|cello|oboe|tromb|bombard|fagot|acorde|caj/.test(ins);
        if(b.formato=='playback'||!FMT[b.formato])b.formato=voz?'karaoke':'playalong';
        else if(otro)b.formato=/piano|guitarr|tecl|ukel|arpa|acorde/.test(ins)||(b.alumnos||[]).length>1?'live':'solo';}
      if(b.t=='al'&&b.instr&&b.instr.trim()){const ps=b.alumnos;if(!ps.some(u=>u.i&&u.i.trim())){ // antes el instrumento era del bloque: se pasa a cada intérprete
        const parts=b.instr.split(/\s*(?:,|\/|&|\+|\sy\s|\se\s)\s*/i).map(x=>x.trim()).filter(Boolean);
        ps.forEach((u,k)=>u.i=parts.length==ps.length?parts[k]:b.instr.trim())}b.instr=''}});
  });
  return dt;
}

async function guardar(E){

    else{const r=await sb.from(TABLA).insert({anio:E.anio,datos:E.datos}).select('id').single();if(r.error)throw r.error;E.id=r.data.id}

async function arrancar(){

    if(/rmi_ediciones|relation|schema cache|does not exist/i.test(e.message||''))return pantallaSQL(e);
    return pantallaLogin('Error al cargar: '+e.message)}
  S.eds.forEach(e=>normaliza(e.datos));
  const hoy=new Date(),cur=hoy.getMonth()>=7?hoy.getFullYear():hoy.getFullYear()-1;
  S.E=S.eds.find(e=>e.anio==cur)||S.eds[0];
  if(!S.E){S.E=nuevaEdicion(cur);S.eds.unshift(S.E);await guardar()}
  S.estado=DEMO?'Prueba: no se guarda':'Guardado';limpiaVacios();render();
}

const clave=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const APODOS={pepe:'jose',pepa:'josefa',paco:'francisco',paca:'francisca',fran:'francisco',curro:'francisco',quico:'francisco',manolo:'manuel',manu:'manuel',lola:'dolores',loli:'dolores',nacho:'ignacio',javi:'javier',dani:'daniel',alex:'alejandro',chema:'jose maria',josema:'jose maria',juanma:'juan manuel',juanjo:'juan jose',juanan:'juan antonio',quique:'enrique',kike:'enrique',rafa:'rafael',pili:'pilar',maite:'maria teresa',mayte:'maria teresa',merche:'mercedes',concha:'concepcion',conchi:'concepcion',charo:'rosario',lupe:'guadalupe',nando:'fernando',fer:'fernando',santi:'santiago',tere:'teresa',isa:'isabel',cris:'cristina',edu:'eduardo',guille:'guillermo',toni:'antonio',tony:'antonio',mari:'maria',marimar:'maria del mar',nico:'nicolas',fede:'federico',seba:'sebastian',vicen:'vicente',rosi:'rosa',trini:'trinidad',encarni:'encarnacion',inma:'inmaculada',puri:'purificacion',reme:'remedios',sole:'soledad',vero:'veronica',bea:'beatriz',caro:'carolina',vale:'valentina',adri:'adrian',migue:'miguel',sergi:'sergio',salva:'salvador',jose:'jose'};
const PART=new Set(['de','del','la','las','los','y','da','van','von']);
function tokens(n){
  let k=String(n||'').toLowerCase().replace(/m[ªa]\.?(?=\s)/g,'maria ');k=clave(k).replace(/[.,'´`\-]/g,' ');
  const t=k.split(' ').filter(x=>x&&!PART.has(x));if(!t.length)return[];
  return [...(APODOS[t[0]]||t[0]).split(' '),...t.slice(1)];
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
const ini=(a,b)=>a==b||(a.length==1&&b.startsWith(a))||(b.length==1&&a.startsWith(b));
function relacion(A,B){ // 2 = la misma persona con seguridad · 1 = posible · 0 = distintas
  const a=tokens(A),b=tokens(B);if(!a.length||!b.length)return 0;
  const sa=a.join(' '),sb=b.join(' ');if(sa==sb)return 2;
  if(!ini(a[0],b[0]))return (Math.min(sa.length,sb.length)>=8&&lev(sa,sb)<=2)?1:0;
  const ra=a.slice(1),rb=b.slice(1);
  if(!ra.length||!rb.length)return 1;
  const [c,l]=ra.length<=rb.length?[ra,rb]:[rb,ra];let j=0,todos=true;
  for(const t of c){while(j<l.length&&!ini(t,l[j]))j++;if(j==l.length){todos=false;break}j++}
  const comun=ra.filter(t=>t.length>1).some(t=>rb.includes(t));
  if(todos&&comun)return 2;
  if(comun||(Math.min(sa.length,sb.length)>=8&&lev(sa,sb)<=2))return 1;
  return 0;
}
const distintasMarcadas=()=>new Set(S.eds.flatMap(e=>(e.datos.distintos||[]).map(p=>[...p].sort().join('|'))));
function personas(){ // agrupa los nombres de todas las ediciones; se recalcula solo cuando cambian los datos
  if(S._per&&S._perV===S.ver)return S._per;
  const nom=new Map();apariciones().forEach(a=>{const k=clave(a.n);if(!nom.has(k))nom.set(k,a.n)});
  const ks=[...nom.keys()],par=new Map(ks.map(k=>[k,k])),raiz=k=>{while(par.get(k)!=k)k=par.get(k);return k};
  const dudas=[],no=distintasMarcadas();
  for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const r=relacion(nom.get(ks[i]),nom.get(ks[j]));
    if(r==2)par.set(raiz(ks[i]),raiz(ks[j]));else if(r==1&&!no.has([ks[i],ks[j]].sort().join('|')))dudas.push([ks[i],ks[j]])}
  const id=new Map(ks.map(k=>[k,raiz(k)]));
  const vistos=new Set();S._per={id,nom,dudas:dudas.filter(([a,b])=>{const ia=id.get(a),ib=id.get(b);if(ia==ib)return false;const k=[ia,ib].sort().join('|');if(vistos.has(k))return false;vistos.add(k);return true})};S._perV=S.ver;return S._per;
}

async function unificar(de,a){ // escribe «a» en lugar de «de» en todas las ediciones

/* ---------- Bloques vacíos: se eliminan solos al cerrarlos ---------- */
function vacioB(b){const t=s=>String(s||'').trim();
  if(b.t=='al')return !b.alumnos.some(u=>t(u.n)||t(u.i))&&!t(b.obra)&&!t(b.autor)&&!t(b.instr)&&!t(b.obs)&&!t(b.yt);
  const rep=(b.rep||[]).some(r=>t(r.obra)||t(r.autor));
  if(b.t=='gr')return !rep&&!t(b.obs)&&!t(b.director)&&!t(b.cantantes)&&!(b.comp||[]).some(c=>t(c.n)||t(c.instr))&&(!t(b.nombre)||(b.coro&&b.nombre=='Coro del IES Infanta Elena'));
  return !rep&&!t(b.obs)&&!t(b.nombre)&&!t(b.presenta);
}
function limpiaVacios(){let n=0;D().dias.forEach(d=>{const a=d.bloques.length;d.bloques=d.bloques.filter(b=>!vacioB(b));n+=a-d.bloques.length});if(n)marcar();return n}
function abrirB(id){S.edit.add(id);render()}
function cerrarB(i,id){S.edit.delete(id);const d=D().dias[i],b=d.bloques.find(x=>x.id==id);if(b&&vacioB(b)){d.bloques=d.bloques.filter(x=>x!==b);marcar()}render()}
/* ---------- Arrastrar: días, tarjetas y presentadores ---------- */
function iniDrag(e,t,txt){S.dragT=t;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',txt||'rmi')}catch(_){}document.body.classList.add('arrastrando')}
function dragDia(e,k){iniDrag(e,{tipo:'dia',k});e.currentTarget.classList.add('arr')}
function dragB(e,i,id){e.stopPropagation();iniDrag(e,{tipo:'b',dia:i,id});e.currentTarget.classList.add('arr')}
function dragP(e,i,k){e.stopPropagation();iniDrag(e,{tipo:'p',dia:i,k});e.currentTarget.classList.add('arr')}
function overDia(e,k){const t=S.dragT;if(!t)return;if(t.tipo=='dia'?t.k==k:t.dia==k)return;e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop')}
function soltarDia(e,k){e.preventDefault();e.stopPropagation();const t=S.dragT;finDrag();if(!t)return;
  if(t.tipo=='dia'){if(t.k!=k)confirmaInter(t.k,k)}
  else if(t.tipo=='b'&&t.dia!=k){const o=D().dias[t.dia],j=o.bloques.findIndex(b=>b.id==t.id);if(j<0)return;const [b]=o.bloques.splice(j,1);
    D().dias[k].bloques.push(b);D().dias[k].no=false;S.edit.delete(b.id);marcar();toast(`«${tituloB(b)}» pasa al ${DIAS[k]}`);render()}
  else if(t.tipo=='p'&&t.dia!=k){const o=D().dias[t.dia],[p]=o.pres.splice(t.k,1);if(!p)return;const dst=D().dias[k];dst.sinPres=false;
    const hueco=dst.pres.findIndex(x=>!x.n.trim());if(hueco>=0)dst.pres[hueco]=p;else dst.pres.push(p);
    if(!o.pres.length)o.pres.push({n:'',g:''});marcar();toast(`${p.n} presenta ahora el ${DIAS[k]}`);render()}
}
function overB(e,id){const t=S.dragT;if(!t||t.tipo!='b'||t.id==id)return;e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('dropb')}
function soltarB(e,i,id){e.preventDefault();e.stopPropagation();const t=S.dragT;finDrag();if(!t||t.tipo!='b'||t.id==id||t.dia!=i)return;
  const a=D().dias[i].bloques,from=a.findIndex(b=>b.id==t.id);if(from<0)return;const [b]=a.splice(from,1);const to=a.findIndex(x=>x.id==id);a.splice(to,0,b);marcar();render()}
function overFin(e){const t=S.dragT;if(!t||t.tipo!='b'||t.dia!=S.dia)return;e.preventDefault()}
function soltarFin(e,i){const t=S.dragT;if(!t||t.tipo!='b'||t.dia!=i)return;e.preventDefault();finDrag();
  const a=D().dias[i].bloques,from=a.findIndex(b=>b.id==t.id);if(from<0)return;const [b]=a.splice(from,1);a.push(b);marcar();render()}
function finDrag(){S.dragT=null;document.body.classList.remove('arrastrando');document.querySelectorAll('.drop,.arr,.dropb').forEach(x=>x.classList.remove('drop','arr','dropb'))}
const vacioDia=d=>!d.no&&!d.bloques.length;
const resumenDia=d=>d.no?'sin concierto':d.bloques.length?d.bloques.map(tituloB).join(', '):'vacío';
function confirmaInter(a,b){
  const ds=D().dias,A=ds[a],B=ds[b],fa=`${DIAS[a]} ${fechaDia(S.E,a).getDate()}`,fb=`${DIAS[b]} ${fechaDia(S.E,b).getDate()}`;
  modal(`<h3>¿Cambiar de día?</h3><p>Lo del <b>${fa}</b> (${esc(resumenDia(A))}) pasa al <b>${fb}</b>${vacioDia(B)?`, y el ${esc(DIAS[a])} queda en blanco.`:`, y lo del ${esc(fb)} (${esc(resumenDia(B))}) pasa al ${esc(fa)}.`}</p>
   <p class="sm mu">No se borra nada: se intercambian los bloques, los presentadores y el nombre del espectáculo. Si el título es el automático («Concierto del…»), se cambia solo al día nuevo.</p>
   <div class="row"><button class="btn p" onclick="intercambiar(${a},${b})">Cambiar</button><button class="btn" onclick="cerrar();render()">Cancelar</button></div>`);
}
function intercambiar(a,b){
  const ds=D().dias,re=/^\s*concierto del (lunes|martes|miércoles|miercoles|jueves|viernes)\s*$/i;
  const fix=(d,to)=>{if(re.test(d.titulo||''))d.titulo=`Concierto del ${DIAS[to]}`};
  const A=ds[a],B=ds[b];fix(A,b);fix(B,a);ds[a]=B;ds[b]=A;
  S.dia=b;S.diaEd=false;cerrar();marcar();toast(`Cambiado: ${DIAS[a]} ⇄ ${DIAS[b]}`);render();
}
function addB(i,b){D().dias[i].bloques.push(b);D().dias[i].no=false;S.edit.add(b.id);marcar();render()}
function mover(i,k,dir){const a=D().dias[i].bloques;[a[k],a[k+dir]]=[a[k+dir],a[k]];marcar();render()}
function borrarB(i,k){const b=D().dias[i].bloques[k];

   <div class="row"><button class="btn p" onclick="D().dias[${i}].bloques.splice(${k},1);marcar();cerrar();render()">Borrar</button><button class="btn" onclick="cerrar()">Cancelar</button></div>`)}
function pasarDia(i,k,j){const [b]=D().dias[i].bloques.splice(k,1);D().dias[j].bloques.push(b);D().dias[j].no=false;marcar();toast(`Bloque pasado al ${DIAS[j]}`);render()}

const nombres=b=>b.alumnos.map(u=>u.n).filter(Boolean).join(', ');
const cursosB=b=>[...new Set(b.alumnos.filter(u=>u.n.trim()).map(cursoU).filter(Boolean))].join(', ');
const repTxt=b=>(b.rep||[]).filter(r=>r.obra).map(r=>`«${r.obra}»${r.autor?` (${r.autor})`:''}`).join(', ');
function tituloB(b){
  if(b.t=='al')return `${nombres(b)||'Alumnos sin nombre'}${b.obra?' · '+b.obra:''}`;
  if(b.t=='gr')return b.nombre||(b.coro?'Coro':'Grupo sin nombre');

/* ---------- Semana: el programa como en un concierto ---------- */
function filasPrograma(d,extra){
  const n=d.bloques.length,L=x=>`<div class="ln">${x||'&nbsp;'}</div>`;
  return d.bloques.map((b,k)=>{
    const num=n>1?`<span class="nu ${catB(b)}">${k+1}</span>`:'';
    const obrasL=b.t=='al'?`<div class="ob">${b.obra?`«${esc(b.obra)}»`:'—'}</div>${b.autor?`<div class="au">${esc(b.autor)}</div>`:''}`
      :(b.rep||[]).filter(r=>r.obra).map((r,j)=>`<div class="ob2">${j+1}. «${esc(limpiaTit(r.obra))}»${r.autor?` <span class="au">${esc(r.autor)}</span>`:''}</div>`).join('')||'—';
    let who,cur,ins;
    if(b.t=='al'){const al=b.alumnos.filter(u=>u.n.trim());
      who=al.map((u,j)=>L(`${j==0?num:'<span class="nu sp"></span>'}<b>${esc(u.n)}</b>${extra?chipVez(u.n):''}`)).join('')||L(num+'—');
      cur=al.map(u=>L(esc(cursoU(u)))).join('');ins=al.map(u=>L(esc(u.i||''))).join('');}
    else if(b.t=='gr'&&b.coro){who=L(`${num}<b>«${esc(b.nombre)}»</b>`)+L(`<span class="mu">Dirección: ${esc(b.director||'—')}</span>`);cur=L('')+L(`${esc(b.cantantes||'?')} voces`);ins=L('')+L('Voces');}
    else if(b.t=='gr'){const c=b.comp.filter(x=>x.n.trim());
      who=L(`${num}<b>«${esc(b.nombre||'Grupo')}»</b>`)+c.map(x=>L(`<span class="nu sp"></span>${esc(x.n)}`)).join('');
      cur=L('')+c.map(x=>L(x.rol=='al'?esc(fmtCurso(x.g))||'Alumno/a':x.rol=='pr'?'Profesor/a':'Invitado/a')).join('');
      ins=L('')+c.map(x=>L(esc(x.instr))).join('');}
    else{who=L(`${num}<b>${esc(b.nombre||'Artista invitado')}</b>`)+L('<span class="mu">Artista invitado</span>');cur=L('');ins=L('');}
    return `<tr class="${b.t}"><td class="who">${who}</td><td class="cu">${cur}</td><td class="in">${ins}</td><td>${obrasL}</td>${extra?`<td class="x">${b.t=='al'?fmtTxt(b)+(conPista(b)&&!b.ok?'<div class="wnn">pista sin probar</div>':''):''}</td><td class="x">${esc(b.obs)}</td>`:''}</tr>`;
  }).join('');
}
const presTxt=d=>d.sinPres?'':d.pres.map(p=>p.n).filter(x=>x.trim()).join(' y ');
function vSemana(){
  const E=S.E;
  return `<div class="row" style="justify-content:space-between;margin-bottom:16px"><div><h2>La semana completa</h2><p class="mu" style="margin:0">${esc(rango(E))} · Recreo ${esc(D().hora)} · ${esc(D().lugar)}</p></div>
   <button class="btn p" onclick="imprimirSemana()">${ICO.print}Imprimir programa de la semana</button></div>
  ${D().dias.map((d,i)=>`<section class="sday ${d.no?'off':''}"><header class="sdh"><div><span class="sdd">${esc(may(fLarga(fechaDia(E,i))))}</span><b>${d.no?'Sin concierto':esc(nombreDia(d)||d.titulo)}</b></div>
    ${d.no?'':`<span class="sdt">${dur(minutos(d))}${presTxt(d)?` · Presentan ${esc(presTxt(d))}`:''}</span>`}</header>
   ${d.no?'':d.bloques.length?`<div class="wrap"><table class="prg"><thead><tr><th>Intérprete</th><th>Curso</th><th>Instrumento</th><th>Obra</th><th class="x">Formato</th><th class="x">Observaciones</th></tr></thead><tbody>${filasPrograma(d,1)}</tbody></table></div>`:'<p class="mu" style="padding:6px 16px 14px;margin:0">Sin nada programado todavía.</p>'}
  </section>`).join('')}`;

function imprimirSemana(){ // reparte los días en folios sin partir nunca un concierto
  const E=S.E;
  const dias=D().dias.map((d,i)=>`<div class="pday"><div class="pdh"><span>${esc(may(fLarga(fechaDia(E,i))))}</span><b>${d.no?'Sin concierto':esc(nombreDia(d)||d.titulo)}</b></div>
    ${d.no?'':d.bloques.length?`<table class="pprg"><thead><tr><th>Intérprete</th><th>Curso</th><th>Instrumento</th><th>Obra</th></tr></thead><tbody>${filasPrograma(d,0)}</tbody></table>${presTxt(d)?`<div class="ppre">Presentan: ${esc(presTxt(d))}</div>`:''}`:'<p class="ppor">Programa por confirmar</p>'}</div>`);
  const cab1=`${cabeceraPr(null)}<h1 style="margin-top:3mm">Programa de la semana</h1><div class="sub">Alumnos y profesores en concierto</div>`,cabN=cabeceraPr(null);
  const m=document.createElement('div');m.style.cssText='position:absolute;left:-10000px;top:0;width:190mm;visibility:hidden';m.className='prog';document.body.appendChild(m);
  const alto=h=>{m.innerHTML=h;return m.getBoundingClientRect().height};
  const mm=alto('<div style="height:100mm"></div>')/100,disp=272*mm;
  const hCab1=alto(cab1),hCabN=alto(cabN),hDia=dias.map(h=>alto(h)+5*mm);m.remove();
  const pags=[];let cur=[],usado=hCab1;
  dias.forEach((h,k)=>{if(cur.length&&usado+hDia[k]>disp){pags.push(cur);cur=[];usado=hCabN}cur.push(h);usado+=hDia[k]});
  if(cur.length)pags.push(cur);
  imprimir(pags.map((p,n)=>`<div class="pg prog">${n?cabN:cab1}${p.join('')}</div>`).join(''),'portrait');
}

/* ---------- Impresión ---------- */
function imprimir(html,orient){
  $('#pgsize').textContent=`@page{size:A4 ${orient||'portrait'};margin:10mm}`;
  $('#print').innerHTML=html;
  const imgs=[...$('#print').querySelectorAll('img')];
  Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>setTimeout(()=>window.print(),150));
}

/* ---------- Cartel del día sobre el modelo con hueco (la imagen no se guarda: solo se usa al generar) ---------- */
const CFGC={top:38,bot:88,mar:10,size:40,color:'#2A1018',f1:'Bricolage Grotesque',f2:'Atkinson Hyperlegible',lh:120,halo:false};
const FUENTES=[['Bricolage Grotesque','Bricolage (la de la app)'],['Montserrat','Montserrat'],['Oswald','Oswald (estrecha)'],['Bebas Neue','Bebas Neue (cartel)'],['Anton','Anton (impacto)'],['Permanent Marker','Permanent Marker (rotulador)'],['Lobster','Lobster (retro)'],['Playfair Display','Playfair (elegante)'],['Atkinson Hyperlegible','Atkinson (muy legible)']];
const cfgC=()=>{const c=D().cartel||(D().cartel={...CFGC});for(const k in CFGC)if(c[k]===undefined)c[k]=CFGC[k];return c};
function textoCartel(i){const d=D().dias[i],L=['# '+(nombreDia(d)||d.titulo)];
  d.bloques.forEach(b=>{L.push('');
    if(b.t=='al'){L.push(b.alumnos.filter(u=>u.n.trim()).map(perU).join(', '));if(b.obra)L.push(`«${b.obra}»${b.autor?` (${b.autor})`:''}`)}
    else{L.push(b.t=='gr'?`«${b.nombre}»`:`${b.nombre}${b.t=='in'?' (artista invitado)':''}`);const o=b.rep.filter(r=>r.obra).map(r=>`«${limpiaTit(r.obra)}»`);if(o.length)L.push(o.join(' · '))}});
  return L.join('\n');
}
async function pintaCartel(){
  const cv=document.getElementById('cv');if(!cv||!S.cImg)return;
  const img=await new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.src=S.cImg});
  const cf=cfgC();
  try{await Promise.all([document.fonts.load(`800 40px "${cf.f1}"`),document.fonts.load(`700 40px "${cf.f1}"`),document.fonts.load(`italic 400 30px "${cf.f2}"`)]);await document.fonts.ready}catch(_){}
  const W=img.naturalWidth,H=img.naturalHeight;cv.width=W;cv.height=H;const c=cv.getContext('2d');c.drawImage(img,0,0);
  const x0=W*cf.mar/100,x1=W*(1-cf.mar/100),y0=H*cf.top/100,y1=H*cf.bot/100,aw=x1-x0,ah=Math.max(10,y1-y0),LH=cf.lh/100;
  const raw=(S.cTxt[S.cDia]??textoCartel(S.cDia)).split('\n');
  const tipo=l=>l.startsWith('# ')?'t':!l.trim()?'g':/^[«"“]/.test(l.trim())?'o':'n';
  const font=(t,s)=>t=='t'?`800 ${s*1.3}px "${cf.f1}", sans-serif`:t=='o'?`italic 400 ${s*.86}px "${cf.f2}", sans-serif`:`700 ${s}px "${cf.f1}", sans-serif`;
  const wrap=(txt,maxw)=>{const out=[];let cur='';txt.split(/\s+/).forEach(w=>{const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxw&&cur){out.push(cur);cur=w}else cur=t});if(cur)out.push(cur);return out};
  const lay=s=>{let h=0;const it=[];raw.forEach(l=>{const t=tipo(l);if(t=='g'){h+=s*.45;it.push({t,h:s*.45});return}
    c.font=font(t,s);const lh=(t=='t'?s*1.3:t=='o'?s*.86:s)*LH,ls=wrap(t=='t'?l.slice(2):l.trim(),aw),extra=t=='t'?s*.4:0;it.push({t,ls,lh,s,extra});h+=ls.length*lh+extra});return{h,it}};
  let s=Math.max(4,Math.round(H*cf.size/1000));for(;s>4;s--){if(lay(s).h<=ah)break}
  const Lt=lay(s);let y=y0+Math.max(0,(ah-Lt.h)/2);c.textAlign='center';c.textBaseline='top';c.lineJoin='round';
  Lt.it.forEach(o=>{if(o.t=='g'){y+=o.h;return}c.font=font(o.t,o.s);o.ls.forEach(l=>{
    if(cf.halo){c.strokeStyle='rgba(255,255,255,.92)';c.lineWidth=Math.max(2,o.s*.18);c.strokeText(l,(x0+x1)/2,y)}
    c.fillStyle=cf.color;c.fillText(l,(x0+x1)/2,y);y+=o.lh});y+=o.extra});
  if(S.cGuia){c.save();c.strokeStyle='rgba(232,0,106,.85)';c.lineWidth=Math.max(2,W/350);c.setLineDash([W/70,W/110]);c.strokeRect(x0,y0,aw,ah);c.restore()}
  const info=document.getElementById('cinfo');if(info)info.textContent=Lt.h>ah?'El texto no cabe ni a tamaño mínimo: acorta el texto o amplía la zona.':`Letra ajustada a ${Math.round(s/H*1000)} (máximo ${cf.size}).`;
}
async function exportaCartel(modo){
  if(!S.cImg)return toast('Carga primero el modelo del cartel',1);
  const g=S.cGuia;S.cGuia=false;await pintaCartel();const cv=$('#cv'),nom=`Cartel_${DIAS[S.cDia]}_${S.E.anio}`;
  if(modo=='png')await new Promise(r=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nom+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);r()},'image/png'));
  else imprimir(`<div class="pg" style="text-align:center"><img src="${cv.toDataURL('image/jpeg',.92)}" style="max-width:190mm;max-height:275mm"></div>`,'portrait');
  S.cGuia=g;setTimeout(pintaCartel,600);
}

function controlesCartel(){
  const cf=cfgC();
  const rng=(k,t,min,max,st)=>`<label class="f">${t} <b class="rv">${cf[k]}${st||''}</b><input type="range" min="${min}" max="${max}" value="${cf[k]}" oninput="cfgC().${k}=+this.value;this.previousElementSibling.textContent=this.value+'${st||''}';marcar();pintaCartel()"></label>`;
  const sel=(k,t)=>`<label class="f">${t}<select onchange="cfgC().${k}=this.value;marcar();pintaCartel()">${FUENTES.map(([f,n])=>`<option value="${f}" ${cf[k]==f?'selected':''} style="font-family:'${f}'">${n}</option>`).join('')}</select></label>`;
  return `<label class="f">Texto del cartel<textarea id="ctx" class="ctxg" oninput="S.cTxt[S.cDia]=this.value;pintaCartel()">${esc(S.cTxt[S.cDia]??textoCartel(S.cDia))}</textarea></label>

function donut(datos,centro){
  const tot=datos.reduce((s,x)=>s+x.n,0);if(!tot)return '<p class="mu sm">Sin datos todavía.</p>';
  let a=-Math.PI/2,arcs='';const R=42,r=26,cx=50,cy=50;
  datos.filter(x=>x.n).forEach(x=>{const f=x.n/tot,b=a+f*Math.PI*2,lg=f>.5?1:0,p=(t,rr)=>`${(cx+rr*Math.cos(t)).toFixed(2)} ${(cy+rr*Math.sin(t)).toFixed(2)}`;
    arcs+=f>=.999?`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${x.c}" stroke-width="${R-r}"/>`
      :`<path d="M${p(a,R)} A${R} ${R} 0 ${lg} 1 ${p(b,R)} L${p(b,r)} A${r} ${r} 0 ${lg} 0 ${p(a,r)} Z" fill="${x.c}"/>`;a=b});
  return `<div class="dn"><svg viewBox="0 0 100 100" role="img" aria-label="${esc(centro||'')}">${arcs}<text x="50" y="49" text-anchor="middle" class="dnn">${tot}</text><text x="50" y="61" text-anchor="middle" class="dnl">${esc(centro||'')}</text></svg>
   <ul>${datos.map(x=>`<li><i style="background:${x.c}"></i>${x.label}<b>${x.n}</b></li>`).join('')}</ul></div>`;
}

}

function apariciones(){ // todas las ediciones
  const r=[];S.eds.forEach(e=>(e.datos.dias||[]).forEach((d,i)=>{if(d.no)return;d.bloques.forEach(b=>{
    const base={anio:e.anio,b};
    if(b.t=='al')b.alumnos.forEach(u=>u.n.trim()&&r.push({...base,rol:esProf(u)?'pr':'al',n:u.n.trim(),g:u.g,instr:u.i||b.instr}));
    if(b.t=='gr'){if(b.coro){if(b.director)r.push({...base,rol:'pr',n:b.director,instr:'Dirección de coro'})}
      else b.comp.forEach(c=>c.n.trim()&&r.push({...base,rol:c.rol,n:c.n.trim(),g:c.g,instr:c.instr}))}
    if(b.t=='in'&&b.nombre)r.push({...base,rol:'in',n:b.nombre,instr:''});
  })}));return r;
}
const SING={voces:'voz',flautas:'flauta',guitarras:'guitarra',saxos:'saxofón',saxofones:'saxofón',saxo:'saxofón',trompetas:'trompeta',violines:'violín',pianos:'piano',teclados:'teclado'};
function instrumentos(t){return String(t||'').split(/,|\/|&|\+|\by\b/i).map(x=>x.replace(/\(.*?\)/g,'').trim().toLowerCase()).filter(Boolean)
  .map(x=>{const w=x.split(' ');w[0]=SING[w[0]]||w[0];return w.join(' ').replace(/^saxofón (alto|tenor|soprano|barítono)s?$/,'saxofón $1')}).map(may)}
function cuenta(arr){const m=new Map();arr.forEach(([k,label])=>{const o=m.get(k)||{label,n:0};o.n++;m.set(k,o)});return[...m.values()].sort((a,b)=>b.n-a.n)}
function barras(lista,max,cls){max=max||Math.max(1,...lista.map(x=>x.n));return lista.map(x=>`<div class="hb"><span>${x.label}</span><span class="b"><i class="${cls||''}" style="width:${x.n/max*100}%"></i></span><span class="n">${x.n}</span></div>`).join('')||'<p class="mu sm">Sin datos todavía.</p>'}

  const porAnio=años.map(y=>({al:new Set(al.filter(a=>a.anio==y).map(a=>idP(a.n))).size,pr:new Set(pr.filter(a=>a.anio==y).map(a=>idP(a.n))).size,ac:S.eds.filter(e=>e.anio==y).flatMap(e=>e.datos.dias.filter(d=>!d.no).flatMap(d=>d.bloques)).length}));
  const porCurso=años.map(y=>{const c={};al.filter(a=>a.anio==y).forEach(a=>{const p=curso(a.g);const k=p?p.niv:'?';c[k]=(c[k]||0)+1});return{y,c}});
  const cur=porCurso.find(p=>p.y==S.E.anio)||{c:{}};const maxC=Math.max(1,...NIVORD.map(k=>cur.c[k]||0));
  const tabla=`<div class="wrap"><table class="sem"><thead><tr><th>Año</th>${NIVORD.map(k=>`<th>${NIV[k]}</th>`).join('')}<th>Sin curso</th><th>Profesores</th></tr></thead><tbody>
    ${porCurso.map(p=>`<tr><td><b>${p.y}</b></td>${NIVORD.map(k=>`<td>${p.c[k]||''}</td>`).join('')}<td>${p.c['?']||''}</td><td><b>${new Set(pr.filter(a=>a.anio==p.y).map(a=>idP(a.n))).size||''}</b></td></tr>`).join('')}</tbody></table></div>`;
  const ins=cuenta(A.filter(a=>a.rol!='in').flatMap(a=>instrumentos(a.instr).map(i=>[clave(i),i]))).slice(0,10);
  const top=x=>{const m=new Map();x.forEach(a=>{const k=idP(a.n);const o=m.get(k)||{label:a.n,n:0,y:new Set()};o.n++;o.y.add(a.anio);if(a.n.length>o.label.length)o.label=a.n;m.set(k,o)});
    return[...m.values()].sort((a,b)=>b.n-a.n||b.y.size-a.y.size).slice(0,10).map(o=>({label:`${esc(o.label)} <span class="mu sm">(${[...o.y].sort().join(', ')})</span>`,n:o.n}))};
  const vets=[...new Map(alumnosDe(S.E).map(a=>[idP(a.n),a])).values()].map(a=>({n:a.n,v:vez(a.n)})).filter(x=>x.v>1).sort((a,b)=>b.v-a.v);
  const obras=S.eds.flatMap(e=>e.datos.dias.filter(d=>!d.no).flatMap(d=>d.bloques.flatMap(b=>b.t=='al'?[{o:b.obra,a:b.autor}]:b.rep.map(r=>({o:limpiaTit(r.obra),a:r.autor})))));
  const aut=cuenta(obras.filter(x=>x.a&&!/original/i.test(x.a)).map(x=>[clave(x.a),esc(x.a)])).slice(0,10);
  const obr=cuenta(obras.filter(x=>x.o).map(x=>[clave(x.o),esc(x.o)])).filter(x=>x.n>1).slice(0,10);
  const dudas=P.dudas.slice(0,12).map(([a,b])=>{const na=P.nom.get(a),nb=P.nom.get(b),j=x=>JSON.stringify(x).replace(/"/g,'&quot;');
    return `<div class="duda"><span><b>${esc(na)}</b> <span class="mu">y</span> <b>${esc(nb)}</b></span><span class="row" style="gap:6px">
     <button class="btn sm" onclick="unificar(${j(na)},${j(nb)})">Misma persona: «${esc(nb)}»</button>
     <button class="btn sm" onclick="unificar(${j(nb)},${j(na)})">Misma persona: «${esc(na)}»</button>
     <button class="btn g sm" onclick="distintas(${j(a)},${j(b)})">Son distintas</button></span></div>`}).join('');
  return `<h2>Estadísticas</h2><p class="mu" style="margin:0 0 18px">Con todas las ediciones guardadas (${años.join(', ')}). Cuenta cada vez que alguien sube al escenario.</p>
  <div class="big"><div><b>${años.length}</b><span>ediciones</span></div><div><b>${distintos(al)}</b><span>alumnos</span></div><div><b>${distintos(pr)}</b><span>profesores</span></div>
   <div><b>${distintos(inv)}</b><span>artistas invitados</span></div><div><b>${blqAl.length}</b><span>actuaciones de alumnos y profesores</span></div></div>
  ${dudas?`<section class="panel dudas"><h3>¿Es la misma persona?</h3><p class="sm mu" style="margin-top:0">Nombres parecidos que la app no se atreve a juntar sola. Elige cómo quieres que se llame: se corrige en todos los años y cuenta para los veteranos.</p>${dudas}</section>`:''}
  <div class="grid4">
   <section class="panel"><h3>Los alumnos que más tocan</h3>${barras(top(al))}</section>

   <section class="panel"><h3>Autores más interpretados</h3>${barras(aut)}</section>
   <section class="panel"><h3>Instrumentos que más suenan</h3>${barras(ins)}</section>
  </div>
  <div class="grid4" style="margin-top:18px">
   <section class="panel"><h3>Alumnos por curso en ${S.E.anio}</h3><div class="cols">${NIVORD.map(k=>`<div class="c"><b>${cur.c[k]||0}</b><i style="height:${(cur.c[k]||0)/maxC*120}px"></i><span>${NIV[k]}</span></div>`).join('')}</div></section>
   <section class="panel"><h3>Veteranos de este año</h3>${vets.length?vets.map(v=>`<div class="hb"><span>${esc(v.n)}</span><span class="b"><i class="o" style="width:${Math.min(100,v.v/Math.max(...vets.map(x=>x.v))*100)}%"></i></span><span class="n">${v.v}.ª</span></div>`).join(''):'<p class="mu sm">Nadie repite todavía de años anteriores.</p>'}</section>

  <div class="grid4" style="margin-top:18px">

  </div>
  <section class="panel" style="margin-top:18px"><h3>Por curso, año a año</h3>${tabla}</section>`;

  <section class="panel" style="margin-top:22px"><h3>Copias e importación</h3>
   <p class="sm mu">«Exportar» descarga la edición en un archivo para guardarlo en Drive como copia. «Importar» carga un archivo de otro año. Estos archivos llevan nombres de alumnos: guárdalos en Drive, no en GitHub.</p>

function nuevaEd(){const max=Math.max(...S.eds.map(e=>e.anio));
  modal(`<h3>Nueva edición</h3><label class="f">Año<input id="na" type="number" value="${max+1}"></label>
   <p class="sm mu">Se copian la hora, el lugar, la carpeta general de Drive y la frase del diploma. La semana se calcula sola: si el 22 de noviembre cae entre semana, esa semana; si cae en fin de semana, la anterior. Luego puedes cambiarla en Ajustes.</p>
   <div class="row"><button class="btn p" onclick="crearEd(+$('#na').value)">Crear</button><button class="btn" onclick="cerrar()">Cancelar</button></div>`)}
async function crearEd(a){if(!a)return;if(S.eds.some(e=>e.anio==a))return toast('Ya existe la edición '+a,1);
  const e=nuevaEdicion(a,S.E);S.eds.push(e);S.eds.sort((x,y)=>y.anio-x.anio);S.E=e;cerrar();await guardar();S.tab='programa';S.dia=0;render()}
function exportar(a){const e=S.eds.find(x=>x.anio==a);
  const b=new Blob([JSON.stringify({app:'RMI',anio:e.anio,datos:e.datos},null,2)],{type:'application/json'});
  const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`RMI_Santa_Cecilia_${a}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(l.href),2000)}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const j=JSON.parse(r.result);if(!j.anio||!j.datos||!Array.isArray(j.datos.dias))throw new Error('formato');
    normaliza(j.datos);const ex=S.eds.find(e=>e.anio==j.anio);
    const hacer=async()=>{if(ex){ex.datos=j.datos;S.E=ex}else{const e={anio:j.anio,datos:j.datos};S.eds.push(e);S.eds.sort((x,y)=>y.anio-x.anio);S.E=e}
      S.ver++;cerrar();await guardar();toast('Edición '+j.anio+' importada');render()};
    if(ex){window._imp=hacer;modal(`<h3>Ya hay una edición ${j.anio}</h3><p>Si importas, se sustituye por la del archivo.</p><div class="row"><button class="btn p" onclick="_imp()">Sustituir</button><button class="btn" onclick="cerrar()">Cancelar</button></div>`)}
    else hacer();
  }catch(e){toast('El archivo no es una edición de los Recreos Musicales',1)}};r.readAsText(f)}
