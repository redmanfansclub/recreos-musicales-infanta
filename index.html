<style>
:root{
  --telon:#8C2643;--telon2:#6F1B33;--oro:#D9A441;--oroc:#F6E6BD;--tinta:#241A1F;--mu:#6E6268;
  --papel:#F1E8EC;--sf:#FFFFFF;--ln:#E4DADF;--mag:#E8006A;--ok:#1E7A4F;--wn:#9A6200;--er:#B42318;
  --acc:#8C2643;--azul:#3B6E99;
  --disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --txt:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{--telon:#5E1529;--telon2:#430E1D;--tinta:#F1EAEE;--mu:#B9AAB2;--papel:#150D11;--sf:#251C21;--ln:#3C2F36;--oroc:#4A3A1C;--ok:#5FCB96;--wn:#E3B04F;--er:#F08A80;--acc:#E7B85A;--azul:#8DB8DE;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--telon:#5E1529;--telon2:#430E1D;--tinta:#F1EAEE;--mu:#B9AAB2;--papel:#150D11;--sf:#251C21;--ln:#3C2F36;--oroc:#4A3A1C;--ok:#5FCB96;--wn:#E3B04F;--er:#F08A80;--acc:#E7B85A;--azul:#8DB8DE;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font:16px/1.5 var(--txt);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
a{color:inherit}
.it{font-style:italic}

/* Cabecera: el telón del salón de actos */
.top{background:var(--telon);color:#FFF6F0;padding:max(20px,env(safe-area-inset-top)) clamp(14px,4vw,32px) 0;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:repeating-linear-gradient(90deg,var(--telon2) 0 18px,var(--telon) 18px 36px);
  -webkit-mask:radial-gradient(18px 10px at 18px 0,#000 98%,transparent) 0 0/36px 10px repeat-x;
          mask:radial-gradient(18px 10px at 18px 0,#000 98%,transparent) 0 0/36px 10px repeat-x}
.brand{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto}
.brand svg{flex:0 0 auto;width:78px;height:78px}
.brand h1{font:800 clamp(21px,3.2vw,30px)/1.05 var(--disp);margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1 .rmi{font:800 13px/1 var(--disp);letter-spacing:.06em;background:var(--oro);color:#3A1F06;padding:5px 8px;border-radius:7px}
.brand p{margin:3px 0 0;color:var(--oro);font:500 15px/1.2 var(--disp)}
.brand .sp{flex:1}
.brand .by{display:block;font-size:11px;opacity:.6;margin-top:4px;letter-spacing:.02em}
.ed{display:flex;align-items:center;gap:10px;font-size:14px}
.ed select{background:var(--telon2);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 8px}
.est{font-size:13px;color:#F0D3DB;min-width:86px;text-align:right}
.tema{background:var(--telon2);border:1px solid rgba(255,255,255,.3);color:#FFE9B8;border-radius:24px;height:44px;padding:0 16px 0 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:700 15px var(--disp)}
.tema:hover{background:rgba(0,0,0,.25)}
.tema svg{width:22px;height:22px}
nav.tabs{display:flex;gap:2px;max-width:1180px;margin:12px auto 0;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:#F6DCE3;padding:9px 14px 11px;cursor:pointer;font:700 15px var(--disp);border-radius:10px 10px 0 0;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--papel);color:var(--acc)}

main{max-width:1180px;margin:0 auto;padding:30px clamp(14px,4vw,32px) 60px}
h2{font:800 24px/1.15 var(--disp);margin:0 0 4px}
h3{font:700 18px/1.2 var(--disp);margin:0 0 8px}
.mu{color:var(--mu)}
.sm{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px}
.panel+.panel{margin-top:18px}
.grid2>.panel{margin:0}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu);min-width:0}
input[type=text],input[type=url],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  background:var(--sf);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;color:var(--tinta);width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mu) 70%,transparent)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--telon);border-color:var(--telon);color:#fff}
.btn.p:hover{background:var(--telon2)}
.btn.g{border-color:transparent;background:none;color:var(--mu);padding:6px 8px}
.btn.g:hover{color:var(--er)}
.btn:disabled{opacity:.45;cursor:default}
.ico{width:18px;height:18px;flex:0 0 auto}

/* El teclado de días */
.piano{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#1C1216;padding:10px 10px 0;border-radius:16px 16px 10px 10px;margin-bottom:26px}
.key{position:relative;background:#FFFDF8;color:#241A1F;border:0;border-radius:0 0 10px 10px;min-height:118px;padding:40px 10px 12px;text-align:left;cursor:pointer;
  box-shadow:inset 0 -6px 0 #E4DCCB;transition:transform .12s,box-shadow .12s}
.key:hover{background:#FFF8E8}
.key[aria-pressed="true"]{background:#F6E6BD;transform:translateY(3px);box-shadow:inset 0 -2px 0 #CDB57C}
.key .dn{font:700 14px var(--disp);text-transform:capitalize;display:block}
.key .dd{font:800 34px/1 var(--disp);display:block;margin:2px 0 4px}
.key .dm{font-size:13px;color:#6E6268}
.key .dots{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#B9A9B0}
.dot.al{background:#E8006A}.dot.gr{background:#3B6E99}.dot.in{background:#C98A12}
.blk{position:absolute;top:10px;width:22px;height:36px;background:#1C1216;border-radius:0 0 5px 5px;transform:translateX(-50%);pointer-events:none}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin:-16px 0 18px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){.key{transition:none}}

.dia{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px 10px 16px;margin-bottom:16px}
.dia .df{font-size:15px;color:var(--mu)}.dia .df b{color:var(--tinta)}
.dia .dbar{flex:1;min-width:120px}
.dia .dt{font-size:14px;white-space:nowrap}.dia .dt.er{color:var(--er)}.dia .dt.wn{color:var(--wn)}
.dia .dno{flex:1;color:var(--mu);font-style:italic}
.dia .ded{flex-basis:100%;border-top:1px solid var(--ln);padding-top:12px}
.perg{background:#F5EBD6;border:1px solid #E2CFA6;border-radius:14px;padding:14px 16px;color:#3B2A14}
.perg h3{font-size:16px}.perg input{background:#FFFBF2;border-color:#E2CFA6;color:#3B2A14}
.perg .btn{background:#FFFBF2;border-color:#E2CFA6;color:#3B2A14}.perg .btn.g{background:none;border-color:transparent;color:#7A6340}
.perg.off{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:14px;color:#7A6340}.perg.off span{flex:1}
:root[data-theme="dark"] .perg{background:#3A2F1E;border-color:#5A4A2E;color:#F1E3C4}
:root[data-theme="dark"] .perg input,:root[data-theme="dark"] .perg .btn{background:#2C2416;border-color:#5A4A2E;color:#F1E3C4}
:root[data-theme="dark"] .perg .btn.g,:root[data-theme="dark"] .perg.off{color:#D6C29A}
.dayhead{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
@media (max-width:760px){.dayhead{grid-template-columns:1fr}}
.barra{height:10px;border-radius:10px;background:color-mix(in srgb,var(--mu) 18%,transparent);overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok);border-radius:10px}
.barra.wn i{background:var(--wn)}.barra.er i{background:var(--er)}
.pres{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;margin-bottom:8px}

function lunesSantaCecilia(anio){ // 22 nov entre semana: esa semana; en fin de semana: la anterior
  const d=new Date(anio,10,22),w=d.getDay(),off=w==0?6:w==6?5:w-1;d.setDate(d.getDate()-off);return d}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pD=s=>{const[a,m,d]=String(s).split('-').map(Number);return new Date(a,m-1,d)};
const fechaDia=(E,i)=>{const d=pD(E.datos.inicio);d.setDate(d.getDate()+i);return d};
const may=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fLarga=d=>`${DIAS[(d.getDay()+6)%7]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
function rango(E){const a=fechaDia(E,0),b=fechaDia(E,4);
  return a.getMonth()==b.getMonth()?`Del ${a.getDate()} al ${b.getDate()} de ${MESES[b.getMonth()]} de ${b.getFullYear()}`
  :`Del ${a.getDate()} de ${MESES[a.getMonth()]} al ${b.getDate()} de ${MESES[b.getMonth()]} de ${b.getFullYear()}`}

/* ---------- Cursos: cada uno lo escribe a su manera ("2B", "2.º ESO B", "segundo b") ---------- */
const NIV={'1ESO':'1.º ESO','2ESO':'2.º ESO','3ESO':'3.º ESO','4ESO':'4.º ESO','1BACH':'1.º Bach.','2BACH':'2.º Bach.','FP':'FP'};
const NIVORD=Object.keys(NIV);
function curso(raw){
  let s=String(raw||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[º°ª.]/g,' ').replace(/\s+/g,' ').trim();
  if(!s||/prof|invit/.test(s))return null;
  if(/\bfp\b|\bf p\b|formacion|ciclo|grado|smr|daw|dam|asir/.test(s))return{niv:'FP',l:''};
  s=s.replace(/primero|primer/g,'1').replace(/segundo/g,'2').replace(/tercero|tercer/g,'3').replace(/cuarto/g,'4');
  const bach=/bach|bto|bachiller/.test(s),m=s.match(/[1-4]/);if(!m)return null;const n=+m[0];
  const s2=s.replace(/bachillerato|bachiller|bach|bto|eso/g,' ');
  const lm=s2.match(/[1-4]\s*([a-h])(?![a-z])/)||s2.match(/(?:^|\s)([a-h])(?![a-z])/);
  const l=lm?lm[1].toUpperCase():'';
  if(bach)return n<=2?{niv:n+'BACH',l}:null;
  return{niv:n+'ESO',l};
}
const fmtCurso=g=>{const p=curso(g);return p?NIV[p.niv]+(p.l?' '+p.l:''):String(g||'').trim()};

  const r=[];(E.datos.dias||[]).forEach((d,i)=>{if(d.no)return;d.bloques.forEach(b=>{

  })});return r;
}
function vez(nombre,E){ // cuántas Santa Cecilia lleva contando esta
  const k=clave(nombre);if(!k)return 0;E=E||S.E;
  const años=new Set(S.eds.filter(e=>e.anio<E.anio&&alumnosDe(e).some(a=>clave(a.n)==k)).map(e=>e.anio));

}

    <div class="row" style="justify-content:space-between;margin-top:10px"><label class="chk"><input type="checkbox" ${d.no?'checked':''} onchange="setP('dias.${i}.no',this.checked,1)">Este día no hay concierto</label>
     <button class="btn p" onclick="S.diaEd=false;render()">${ICO.check}Listo</button></div></div>`:''}
  </section>
  ${d.no?'':`
  ${d.sinPres?`<div class="perg off">${ICO.mic}<span>Sin presentadores este día</span><button class="btn g" style="color:var(--acc)" onclick="setP('dias.${i}.sinPres',false,1)">Añadir presentadores</button></div>`:
  `<section class="perg"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0;display:flex;align-items:center;gap:8px">${ICO.mic}Presentadores</h3>
    <button class="btn g" onclick="setP('dias.${i}.sinPres',true,1)">Sin presentadores</button></div>
   ${d.pres.map((p,k)=>`<div class="pres"><input type="text" placeholder="Nombre" value="${esc(p.n)}" oninput="setP('dias.${i}.pres.${k}.n',this.value)" aria-label="Presentador ${k+1}">
     <input type="text" placeholder="Curso" list="cursos" value="${esc(p.g)}" oninput="setP('dias.${i}.pres.${k}.g',this.value)" aria-label="Curso del presentador ${k+1}">
     <button class="btn g" title="Quitar" onclick="delP('dias.${i}.pres',${k})">${ICO.del}</button></div>`).join('')}
   <button class="btn" onclick="pushP('dias.${i}.pres',{n:'',g:''})">${ICO.plus}Añadir presentador</button></section>`}
  ${d.bloques.length?d.bloques.map((b,k)=>vBloque(b,i,k,d.bloques.length)).join(''):`<div class="vacio">Todavía no hay nada programado este día. Añade un bloque.</div>`}
  <div class="addbar">
   <button class="btn p" onclick="addB(${i},nuevoAl())">${ICO.plus}Alumnos</button>
   <button class="btn" onclick="addB(${i},nuevoGr())">${ICO.plus}Grupo</button>
   <button class="btn" onclick="addB(${i},nuevoGr(1))">${ICO.plus}Coro</button>
   <button class="btn" onclick="addB(${i},nuevoIn())">${ICO.plus}Artista invitado</button></div>`}
  <datalist id="cursos">${Object.values(NIV).map(v=>`<option value="${v}">`).join('')}</datalist>`;
}
/* ---------- Duraciones ("3:30", "3,5" o "3") ---------- */
function parseMin(v){const s=String(v||'').trim();const m=s.match(/^(\d+)\s*[:']\s*(\d{1,2})$/);if(m)return +m[1]+Math.min(59,+m[2])/60;const n=parseFloat(s.replace(',','.'));return isFinite(n)?n:0}
function fmtMin(m){m=Number(m)||0;let mm=Math.floor(m),ss=Math.round((m-mm)*60);if(ss==60){mm++;ss=0}return `${mm}:${String(ss).padStart(2,'0')}`}
const dur=m=>{m=Number(m)||0;return Number.isInteger(m)?`${m} min`:`${fmtMin(m)} min`};
const limpiaTit=t=>String(t||'').replace(/^\s*\d+\s*[.)\-–]\s*/,'');
/* ---------- Bloques: modo ver / editar ---------- */
const nvChip=g=>{const p=curso(g);if(p)return `<span class="nv nv-${p.niv}">${esc(fmtCurso(g))}</span>`;return g&&String(g).trim()?`<span class="nv">${esc(g)}</span>`:''};
const rolTxt=c=>({al:'Alumno/a',pr:'Profesor/a',in:'Invitado/a'})[c.rol]||'';
function resumenB(b){
  if(b.t=='al'){const n=b.alumnos.filter(u=>u.n).length;return `Alumnos · ${n} ${n==1?'intérprete':'intérpretes'} · ${b.formato=='acappella'?ACAP:'Con playback'} · ${dur(minB(b))}`}
  const no=b.rep.filter(r=>r.obra).length,obr=`${no} ${no==1?'obra':'obras'}`;
  if(b.t=='gr'&&b.coro)return `Coro · ${b.cantantes?esc(b.cantantes)+' voces':'voces sin indicar'} · ${obr} · ${dur(minB(b))}`;
  if(b.t=='gr'){const n=b.comp.filter(c=>c.n).length;return `Grupo · ${n} ${n==1?'músico':'músicos'} · ${obr} · ${dur(minB(b))}`}
  return `Artista invitado · ${obr} · ${dur(minB(b))}`;
}
function cabBloque(b,i,k,n,edit,plegado){
  const tt=b.t=='gr'&&b.coro?'co':b.t;
  const tit=b.t=='al'?(esc(nombres(b))||'Alumnos sin nombre'):esc(b.nombre||TB[tt]);
  const otros=D().dias.map((x,j)=>j!=i?`<option value="${j}">${DIAS[j]}</option>`:'').join('');
  return `<div class="bh ${b.t}"><span class="num">${k+1}</span><div class="bt"><b>${tit}</b><span>${resumenB(b)}</span></div><div class="bacc">
   ${edit?`<select aria-label="Pasar a otro día" onchange="if(this.value!=='')pasarDia(${i},${k},+this.value)"><option value="">Pasar a…</option>${otros}</select>
     <button class="btn g" title="Borrar bloque" onclick="borrarB(${i},${k})">${ICO.del}</button>
     <button class="btn p" onclick="toggleEdit('${b.id}')">${ICO.check}Listo</button>`
   :`<button class="btn g" title="Subir" ${k==0?'disabled':''} onclick="mover(${i},${k},-1)">${ICO.up}</button>
     <button class="btn g" title="Bajar" ${k==n-1?'disabled':''} onclick="mover(${i},${k},1)">${ICO.down}</button>
     <button class="btn" onclick="toggleEdit('${b.id}')">${ICO.edit}Editar</button>
     <button class="btn g" title="${plegado?'Desplegar':'Plegar'}" aria-expanded="${!plegado}" onclick="toggleFold('${b.id}')">${plegado?ICO.down:ICO.up2}</button>`}</div></div>`;
}
function setlist(rep){const r=rep.filter(x=>x.obra||x.autor);
  return r.length?`<div class="sec setl"><div class="sl">${ICO.list}Repertorio</div>${r.map((x,j)=>`<div class="sli"><span class="sn">${j+1}</span><div class="st"><b>${esc(limpiaTit(x.obra))||'—'}</b> ${x.autor?`<i>${esc(x.autor)}</i>`:''}</div><span class="sd">${fmtMin(x.min)}</span></div>`).join('')}</div>`:''}
const necesidades=b=>b.obs?`<div class="sec nece">${ICO.plug}<span>${esc(b.obs)}</span></div>`:'';
function verBloque(b){
  if(b.t=='al')return `<div class="sec"><div class="sl">${ICO.users}Intérpretes</div><div class="cards">${b.alumnos.map(u=>`<div class="mc al nm"><b>${esc(u.n)||'Sin nombre'}</b><span>${nvChip(u.g)}${chipVez(u.n)}</span></div>`).join('')}</div></div>
   <div class="sec obra"><div class="ob">${b.obra?`«${esc(b.obra)}»`:'<span class="mu">Obra sin indicar</span>'}</div>${b.autor?`<div class="oa">${esc(b.autor)}</div>`:''}
    <div class="meta"><span class="pill ${b.formato=='acappella'?'ac':''}">${b.formato=='acappella'?ACAP:'Con playback'}</span>${b.instr?`<span>${ICO.music}${esc(b.instr)}</span>`:''}<span>${ICO.clock}${fmtMin(b.min)}</span>
    ${b.formato=='playback'?(b.yt&&/^https?:/.test(b.yt)?`<a href="${esc(b.yt)}" target="_blank" rel="noopener">Abrir playback</a>`:'')+`<span class="${b.ok?'okk':'wnn'}">${b.ok?'Playback probado':'Playback sin probar'}</span>`:''}</div></div>${necesidades(b)}`;
  if(b.t=='gr'&&b.coro)return `<div class="sec"><div class="sl">${ICO.users}Coro</div><div class="cards"><div class="mc pr"><b>${esc(b.director)||'Sin indicar'}</b><span>Dirección</span></div><div class="mc"><b>${esc(b.cantantes)||'?'}</b><span>cantantes</span></div></div></div>${setlist(b.rep)}${necesidades(b)}`;
  if(b.t=='gr')return `<div class="sec"><div class="sl">${ICO.users}Músicos</div><div class="cards">${b.comp.filter(c=>c.n||c.instr).map(c=>`<div class="mc ${c.rol}"><em class="rtag ${c.rol}">${rolTxt(c)}</em><b>${esc(c.n)||'Sin nombre'}</b><span class="ins">${ICO.music}${esc(c.instr)||'Instrumento sin indicar'}</span>${c.rol=='al'&&c.g?`<span>${nvChip(c.g)}</span>`:''}</div>`).join('')||'<span class="mu sm">Sin músicos todavía.</span>'}</div></div>${setlist(b.rep)}${necesidades(b)}`;
  return `${b.presenta?`<div class="sec"><div class="sl">${ICO.users}Presentación</div><p style="margin:0">${esc(b.presenta)}</p></div>`:''}${setlist(b.rep)}${necesidades(b)}`;
}
function vRep(P,rep){
  return `<div class="sec setl"><div class="sl">${ICO.list}Repertorio <span class="mu" style="font-weight:400">· la duración como 3:30</span></div>${rep.map((r,j)=>`<div class="rep">
    <input type="text" placeholder="Obra" value="${esc(r.obra)}" oninput="setP('${P}.rep.${j}.obra',this.value)" aria-label="Obra ${j+1}">
    <input class="au" type="text" placeholder="Autor" value="${esc(r.autor)}" oninput="setP('${P}.rep.${j}.autor',this.value)" aria-label="Autor ${j+1}">
    <input type="text" inputmode="decimal" placeholder="3:30" value="${fmtMin(r.min)}" title="Duración (minutos:segundos)" aria-label="Duración" onchange="setP('${P}.rep.${j}.min',parseMin(this.value),1)">
    <button class="btn g" title="Quitar" ${rep.length<2?'disabled':''} onclick="delP('${P}.rep',${j})">${ICO.del}</button></div>`).join('')}
   <button class="btn sm" onclick="pushP('${P}.rep',{obra:'',autor:'',min:4})">${ICO.plus}Añadir obra</button></div>`;
}
function editarBloque(b,P){
  if(b.t=='al')return `<div class="sec"><div class="sl">${ICO.users}Intérpretes</div>${b.alumnos.map((u,j)=>`<div class="alu"><input type="text" placeholder="Nombre y apellidos" value="${esc(u.n)}" oninput="setP('${P}.alumnos.${j}.n',this.value)" onchange="render()" aria-label="Intérprete ${j+1}">
       <input type="text" placeholder="Curso" list="cursos" value="${esc(u.g)}" oninput="setP('${P}.alumnos.${j}.g',this.value)" onchange="render()" aria-label="Curso">
       <span title="Así lo entiende la app">${nvChip(u.g)||'<span class="mu sm">—</span>'}</span>
       <button class="btn g" title="Quitar" ${b.alumnos.length<2?'disabled':''} onclick="delP('${P}.alumnos',${j})">${ICO.del}</button></div>`).join('')}
     <button class="btn sm" onclick="pushP('${P}.alumnos',{n:'',g:''})">${ICO.plus}Añadir intérprete</button></div>
    <div class="sec obra"><div class="actg" style="margin-top:0"><label class="f">Obra<input type="text" value="${esc(b.obra)}" placeholder="Título completo" oninput="setP('${P}.obra',this.value)"></label>
      <label class="f">Autor o intérprete original<input type="text" value="${esc(b.autor)}" oninput="setP('${P}.autor',this.value)"></label></div>
     <div class="actg3"><div class="f"><span>Formato</span><div class="seg" role="group">
       <button aria-pressed="${b.formato=='playback'}" onclick="setP('${P}.formato','playback',1)">Con playback</button>
       <button aria-pressed="${b.formato=='acappella'}" onclick="setP('${P}.formato','acappella',1)">${ACAP}</button></div></div>
      <label class="f">Instrumento(s)<input type="text" value="${esc(b.instr)}" placeholder="Voz, piano, guitarra…" oninput="setP('${P}.instr',this.value)"></label>
      <label class="f">Duración<input type="text" inputmode="decimal" placeholder="3:30" value="${fmtMin(b.min)}" onchange="setP('${P}.min',parseMin(this.value),1)"></label></div>
     ${b.formato=='playback'?`<div class="actg" style="align-items:end"><label class="f">Enlace del playback (YouTube)<input type="url" value="${esc(b.yt)}" placeholder="https://…" oninput="setP('${P}.yt',this.value)"></label>
      <div class="row">${b.yt&&/^https?:/.test(b.yt)?`<a class="btn" href="${esc(b.yt)}" target="_blank" rel="noopener">Abrir</a>`:''}
       <label class="chk"><input type="checkbox" ${b.ok?'checked':''} onchange="setP('${P}.ok',this.checked,1)">Playback probado</label></div></div>`:''}</div>`;
  if(b.t=='gr')return `<div class="sec"><div class="actg" style="margin-top:0"><label class="f">${b.coro?'Nombre del coro':'Nombre del grupo'}<input type="text" value="${esc(b.nombre)}" oninput="setP('${P}.nombre',this.value)" onchange="render()"></label>
      ${b.coro?`<div class="row" style="flex-wrap:nowrap"><label class="f" style="flex:2">Director/a<input type="text" value="${esc(b.director)}" oninput="setP('${P}.director',this.value)"></label>
       <label class="f" style="flex:1">Cantantes<input type="number" min="1" value="${esc(b.cantantes)}" oninput="setP('${P}.cantantes',this.value)"></label></div>`:'<span></span>'}</div>
     ${b.coro?'':`<div class="sl" style="margin-top:14px">${ICO.users}Músicos</div>${b.comp.map((c,j)=>`<div class="comp">
       <input type="text" placeholder="Nombre" value="${esc(c.n)}" oninput="setP('${P}.comp.${j}.n',this.value)" aria-label="Músico ${j+1}">
       <input type="text" placeholder="Instrumento" value="${esc(c.instr)}" oninput="setP('${P}.comp.${j}.instr',this.value)" aria-label="Instrumento">
       <select aria-label="Papel" class="rolsel ${c.rol}" onchange="setP('${P}.comp.${j}.rol',this.value,1)">${Object.entries(ROL).map(([v,t])=>`<option value="${v}" ${c.rol==v?'selected':''}>${t}</option>`).join('')}</select>
       ${c.rol=='al'?`<input type="text" placeholder="Curso" list="cursos" value="${esc(c.g)}" oninput="setP('${P}.comp.${j}.g',this.value)" onchange="render()" aria-label="Curso">`:'<span></span>'}
       <button class="btn g del" title="Quitar" onclick="delP('${P}.comp',${j})">${ICO.del}</button></div>`).join('')}
      <button class="btn sm" onclick="pushP('${P}.comp',{n:'',instr:'',rol:'pr',g:''})">${ICO.plus}Añadir músico</button>`}</div>${vRep(P,b.rep)}`;
  return `<div class="sec"><label class="f">Artista o grupo invitado<input type="text" value="${esc(b.nombre)}" oninput="setP('${P}.nombre',this.value)" onchange="render()"></label>
     <label class="f" style="margin-top:10px">Presentación breve para los presentadores<textarea style="min-height:70px" oninput="setP('${P}.presenta',this.value)" placeholder="Quién es, de dónde viene, qué estilo toca…">${esc(b.presenta)}</textarea></label></div>${vRep(P,b.rep)}`;
}
function vBloque(b,i,k,n){
  const P=`dias.${i}.bloques.${k}`,edit=S.edit.has(b.id),pleg=!edit&&S.fold.has(b.id);
  return `<article class="blq ${b.t} ${edit?'editando':''}">${cabBloque(b,i,k,n,edit,pleg)}
   ${pleg?'':`<div class="bb">${edit?editarBloque(b,P)+`<div class="sec nece"><label class="f" style="flex:1">${b.t=='al'?'Necesidades y observaciones':'Necesidades técnicas'}<input type="text" value="${esc(b.obs)}" placeholder="Micros, atriles, piano, amplis, enchufes…" oninput="setP('${P}.obs',this.value)"></label></div>`:verBloque(b)}</div>`}</article>`;
}
function toggleEdit(id){S.edit.has(id)?S.edit.delete(id):S.edit.add(id);render()}
function toggleFold(id){S.fold.has(id)?S.fold.delete(id):S.fold.add(id);render()}
function addB(i,b){D().dias[i].bloques.push(b);D().dias[i].no=false;S.edit.add(b.id);marcar();render()}
function mover(i,k,dir){const a=D().dias[i].bloques;[a[k],a[k+dir]]=[a[k+dir],a[k]];marcar();render()}
function borrarB(i,k){const b=D().dias[i].bloques[k];
  modal(`<h3>¿Borrar este bloque?</h3><p>${esc(tituloB(b))}</p>
   <div class="row"><button class="btn p" onclick="D().dias[${i}].bloques.splice(${k},1);marcar();cerrar();render()">Borrar</button><button class="btn" onclick="cerrar()">Cancelar</button></div>`)}
function pasarDia(i,k,j){const [b]=D().dias[i].bloques.splice(k,1);D().dias[j].bloques.push(b);D().dias[j].no=false;marcar();toast(`Bloque pasado al ${DIAS[j]}`);render()}

/* ---------- Textos de cada bloque ---------- */
const nombres=b=>b.alumnos.map(u=>u.n).filter(Boolean).join(', ');
const cursosB=b=>[...new Set(b.alumnos.map(u=>fmtCurso(u.g)).filter(Boolean))].join(', ');
const repTxt=b=>(b.rep||[]).filter(r=>r.obra).map(r=>`«${r.obra}»${r.autor?` (${r.autor})`:''}`).join(', ');
function tituloB(b){
  if(b.t=='al')return `${nombres(b)||'Alumnos sin nombre'}${b.obra?' · '+b.obra:''}`;
  if(b.t=='gr')return b.nombre||(b.coro?'Coro':'Grupo sin nombre');
  return b.nombre||'Artista invitado';
}
const compTxt=b=>b.comp.filter(c=>c.n).map(c=>`${c.n}${c.instr?` (${c.instr})`:''}`).join(', ');

/* ---------- Semana ---------- */
function filaSemana(b){
  if(b.t=='al')return `<tr><td><span class="tag">Alumnos</span></td><td>${esc(nombres(b))||'<span class="mu">—</span>'} ${b.alumnos.map(u=>chipVez(u.n)).join('')}</td><td>${esc(cursosB(b))}</td><td>${esc(b.obra)}${b.autor?` <span class="mu">(${esc(b.autor)})</span>`:''}</td><td>${b.formato=='acappella'?ACAP:'Playback'}${b.formato=='playback'&&!b.ok?' <span class="sm" style="color:var(--wn)">sin probar</span>':''}</td><td>${esc(b.instr)}</td><td>${esc(b.obs)}</td></tr>`;
  if(b.t=='gr')return `<tr><td><span class="tag">${b.coro?'Coro':'Grupo'}</span></td><td><b>${esc(b.nombre)}</b><br><span class="sm mu">${b.coro?`Dir.: ${esc(b.director||'—')} · ${esc(b.cantantes||'?')} cantantes`:esc(compTxt(b))}</span></td><td></td><td>${esc(repTxt(b))}</td><td></td><td></td><td>${esc(b.obs)}</td></tr>`;
  return `<tr><td><span class="tag">Invitado</span></td><td><b>${esc(b.nombre)}</b></td><td></td><td>${esc(repTxt(b))}</td><td></td><td></td><td>${esc(b.obs)}</td></tr>`;
}
function vSemana(){
  const E=S.E;
  return `<div class="row" style="justify-content:space-between;margin-bottom:14px"><div><h2>La semana completa</h2><p class="mu" style="margin:0">${esc(rango(E))} · ${esc(D().hora)} · ${esc(D().lugar)}</p></div>
   <button class="btn p" onclick="imprimirSemana()">${ICO.print}Imprimir programa de la semana</button></div>
  ${D().dias.map((d,i)=>`<section class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(may(fLarga(fechaDia(E,i))))}</h3>
     <span class="tag">${d.no?'Sin concierto':dur(minutos(d))}</span></div>
   ${d.no?'':`<p style="margin:4px 0 8px"><b>${esc(d.titulo)}</b>${d.sub?' · '+esc(d.sub):''}</p>
    ${d.bloques.length?`<div class="wrap"><table class="sem"><thead><tr><th>Tipo</th><th>Intérpretes</th><th>Curso</th><th>Obra</th><th>Formato</th><th>Instrumento</th><th>Observaciones</th></tr></thead><tbody>${d.bloques.map(filaSemana).join('')}</tbody></table></div>`:'<p class="mu">Sin nada programado todavía.</p>'}
    <p class="sm mu" style="margin:8px 0 0">${d.sinPres?'Sin presentadores':'Presentan: '+esc(d.pres.map(p=>p.n+(p.g?` (${fmtCurso(p.g)})`:'')).filter(x=>x.trim()).join(' y ')||'sin asignar')}</p>`}
  </section>`).join('')}`;
}

/* ---------- Impresión ---------- */
function imprimir(html,orient){
  $('#pgsize').textContent=`@page{size:A4 ${orient||'portrait'};margin:10mm}`;
  $('#print').innerHTML=html;
  const imgs=[...$('#print').querySelectorAll('img')];
  Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>setTimeout(()=>window.print(),150));
}
function cabeceraPr(dIdx,derecha){ // como el cartel de pendientes: logo del instituto a la izquierda y el departamento a la derecha

  const d=derecha!=null?derecha:dIdx==null?`<b>${esc(rango(E).replace(/ de \d{4}$/,''))}</b><br>${lugar}`:`<b>${esc(may(fLarga(fechaDia(E,dIdx))))}</b><br>${lugar}`;
  return `<div class="pr-h"><img src="${LOGO_IES}" alt="IES Infanta Elena"><span class="sp"></span><div class="r"><b>Departamento de Música</b><span>Curso ${esc(D().curso)}</span></div></div>
   <div class="pr-t">${logo()}<div class="t"><b>${NOMBRE}</b><span>Semana de Santa Cecilia</span></div><div class="d">${d}</div></div>`;
}
function hojaApuntes(){

function fichaBloque(b,k){
  if(b.t=='al')return `<div class="ficha"><h4><span>${k}. Alumnos</span><small>${b.formato=='acappella'?'<i>a cappella</i>':'Con playback'}${b.formato=='playback'?(b.ok?' · probado ✓':' · sin probar'):''} · ${dur(minB(b))}</small></h4>
   <table><tr><th>Intérprete</th><th>Curso</th><th>Obra</th><th>Instrumento</th></tr>${b.alumnos.map((u,j)=>`<tr><td>${esc(u.n)}${vez(u.n)>1?` <small>(${vez(u.n)}.ª vez)</small>`:''}</td><td>${esc(fmtCurso(u.g))}</td>${j==0?`<td rowspan="${b.alumnos.length}"><b>${esc(b.obra)}</b>${b.autor?`<br>${esc(b.autor)}`:''}</td><td rowspan="${b.alumnos.length}">${esc(b.instr)}</td>`:''}</tr>`).join('')}</table>
   ${b.obs?`<p><b>Necesidades:</b> ${esc(b.obs)}</p>`:''}${b.yt&&b.formato=='playback'?`<p style="font-size:8.5pt;color:#555;word-break:break-all">${esc(b.yt)}</p>`:''}</div>`;
  const rep=`<table><tr><th>#</th><th>Obra</th><th>Autor</th><th>Min.</th></tr>${b.rep.map((r,j)=>`<tr><td>${j+1}</td><td>${esc(r.obra)}</td><td>${esc(r.autor)}</td><td>${fmtMin(r.min)}</td></tr>`).join('')}</table>`;
  if(b.t=='gr')return `<div class="ficha"><h4><span>${k}. ${b.coro?'Coro':'Grupo'}: ${esc(b.nombre)}</span><small>${dur(minB(b))}</small></h4>
   ${b.coro?`<p><b>Director/a:</b> ${esc(b.director||'—')} · <b>Cantantes:</b> ${esc(b.cantantes||'—')}</p>`:
   `<table><tr><th>Componente</th><th>Instrumento</th><th>Papel</th></tr>${b.comp.map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.instr)}</td><td>${ROL[c.rol]}${c.rol=='al'&&c.g?' · '+esc(fmtCurso(c.g)):''}</td></tr>`).join('')}</table>`}
   ${rep}${b.obs?`<p><b>Necesidades técnicas:</b> ${esc(b.obs)}</p>`:''}</div>`;
  return `<div class="ficha"><h4><span>${k}. Artista invitado: ${esc(b.nombre)}</span><small>${dur(minB(b))}</small></h4>${b.presenta?`<p>${esc(b.presenta)}</p>`:''}${rep}${b.obs?`<p><b>Necesidades técnicas:</b> ${esc(b.obs)}</p>`:''}</div>`;
}
function fichaDia(i){const d=D().dias[i];
  return `<div class="pg">${cabeceraPr(i)}<div style="font:800 14pt var(--disp);margin:2mm 0 3mm">${esc(d.titulo)}${d.sub?' · '+esc(d.sub):''} <span style="font:400 10pt var(--txt);color:#555">· ${dur(minutos(d))} previstos</span></div>
   ${d.sinPres?'':`<p style="font-size:10.5pt;margin:0 0 3mm"><b>Presentan:</b> ${esc(d.pres.map(p=>p.n+(p.g?` (${fmtCurso(p.g)})`:'')).filter(x=>x.trim()).join(' y ')||'sin asignar')}</p>`}
   ${d.bloques.map((b,k)=>fichaBloque(b,k+1)).join('')||'<p>Sin nada programado.</p>'}</div>`}
function itemPrograma(b){
  if(b.t=='al'){const ex=[cursosB(b),b.instr].filter(Boolean).join(' – ');
    return `<div class="itm"><b>${esc(nombres(b))}</b> ${ex?`(${esc(ex)})`:''}<i>${b.obra?`«${esc(b.obra)}»`:''}${b.autor?` (${esc(b.autor)})`:''}</i></div>`}
  const obras=b.rep.filter(r=>r.obra).map((r,j)=>`${j+1}. «${esc(r.obra)}»${r.autor?` ${esc(r.autor)}`:''}`).join('<br>');
  if(b.t=='gr')return `<div class="itm"><b>«${esc(b.nombre)}»</b>${b.coro?`<small>Dirección: ${esc(b.director||'')} · ${esc(b.cantantes||'')} voces</small>`:`<small>${esc(compTxt(b))}</small>`}<i>${obras}</i></div>`;
  return `<div class="itm"><b>${esc(b.nombre)}</b><small>Artista invitado</small><i>${obras}</i></div>`;
}
function programaDia(i){const d=D().dias[i],pres=d.sinPres?[]:d.pres.map(p=>p.n).filter(Boolean);
  return `<div class="pg prog">${cabeceraPr(i)}<h1>${esc(d.titulo)}</h1><div class="sub">${d.sub?esc(d.sub)+' · ':''}${esc(fLarga(fechaDia(S.E,i)))}</div>
   ${d.bloques.map(itemPrograma).join('')||'<p style="text-align:center;color:#777">Programa por confirmar</p>'}
   ${pres.length?`<div class="pre">Presentan: <b>${esc(pres.join(' y '))}</b></div>`:''}</div>`}
function imprimirSemana(){
  const E=S.E,lin=b=>b.t=='al'?`${esc(nombres(b))}${cursosB(b)?` (${esc(cursosB(b))})`:''}${b.obra?`: «${esc(b.obra)}»`:''}${b.autor?` – ${esc(b.autor)}`:''}`
    :`<b>${esc(b.nombre)}</b>${b.t=='in'?' (artista invitado)':''}${repTxt(b)?': '+esc(repTxt(b)):''}`;
  const filas=D().dias.map((d,i)=>`<tr><td class="d">${esc(may(DIAS[i]))} ${fechaDia(E,i).getDate()}</td><td>${d.no?'<i style="color:#777">Sin concierto</i>':
    `<b>${esc(d.titulo)}</b>${d.sub?' · '+esc(d.sub):''}<br>${d.bloques.map(lin).join('<br>')||'<i style="color:#777">Por confirmar</i>'}`}</td></tr>`).join('');

}
function listaAlumnosVales(){const r=[],v=new Set();alumnosDe(S.E).forEach(a=>{const k=clave(a.n)+'|'+a.dia;if(!v.has(k)){v.add(k);r.push(a)}});return r}
function valeHTML(nombre,dia){

  return `<div class="vale">${art}<div class="tx"><span class="v">VALE</span><span class="d">por un desayuno en la cantina del IES Infanta Elena</span>

function imprimirVales(){
  const modo=$('#vmodo').value;
  let lista=modo=='nombres'?listaAlumnosVales().map(a=>[a.n,a.dia]):Array.from({length:Math.max(1,Number($('#vnum').value)||8)},()=>['','']);
  if(!lista.length)return toast('Todavía no hay alumnos con nombre',1);
  let html='';for(let p=0;p<lista.length;p+=8)html+=`<div class="pg"><div class="vales">${lista.slice(p,p+8).map(([n,d])=>valeHTML(n,d)).join('')}</div></div>`;
  imprimir(html,'portrait');

function cargaImg(inp,k){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S[k]=r.result;render()};r.readAsDataURL(f)}
function listaDiplomas(){ // un diploma por alumno, con todo lo que ha tocado esa semana
  const m=new Map();alumnosDe(S.E).forEach(a=>{const k=clave(a.n);if(!m.has(k))m.set(k,{n:a.n,obras:[]});
    const o=a.b.t=='al'?a.b.obra:(a.b.nombre?`con ${a.b.nombre}`:'');if(o&&!m.get(k).obras.includes(o))m.get(k).obras.push(o)});
  return [...m.values()];
}

  const obras=p.obras.map(o=>o.startsWith('con ')?esc(o):`«${esc(o)}»`).join(', ');
  return `<div class="pg"><div class="dip">${fondo}<div class="txt" style="top:${Number(dp.top)||52}%;transform:translateY(-50%)">
   <div class="nom">${esc(p.n)}</div>${obras?`<div class="obra">por su interpretación de ${obras}</div>`:''}<div class="fr">${esc(dp.frase)}</div></div>

}

function impFicha(){const v=$('#fdia').value,idx=v=='all'?D().dias.map((d,i)=>d.no?-1:i).filter(i=>i>=0):[+v];imprimir(idx.map(fichaDia).join(''),'portrait')}

function siguiente(i){for(let j=i+1;j<5;j++){const d=D().dias[j];if(!d.no)return{j,d}}return null}
function listaBloques(d){return d.bloques.map((b,k)=>{
  if(b.t=='al')return `${k+1}. Alumnos: ${b.alumnos.filter(u=>u.n).map(u=>`${u.n}${u.g?` (${fmtCurso(u.g)})`:''}${vez(u.n)>1?` [es su ${vez(u.n)}.ª Santa Cecilia]`:''}`).join(', ')||'(sin nombre)'} · ${b.instr||'instrumento sin indicar'} · «${b.obra||'obra sin indicar'}»${b.autor?` de ${b.autor}`:''} · ${b.formato=='acappella'?'a cappella':'con playback'}${b.obs?` · nota: ${b.obs}`:''}`;
  const rep=b.rep.filter(r=>r.obra).map(r=>`«${r.obra}»${r.autor?` de ${r.autor}`:''}`).join('; ')||'(repertorio sin indicar)';
  if(b.t=='gr'&&b.coro)return `${k+1}. Coro «${b.nombre}», dirigido por ${b.director||'(sin indicar)'}, con ${b.cantantes||'varios'} cantantes. Repertorio: ${rep}`;
  if(b.t=='gr')return `${k+1}. Grupo «${b.nombre||'sin nombre'}»: ${b.comp.filter(c=>c.n).map(c=>`${c.n} (${c.instr||'?'}, ${ROL[c.rol].toLowerCase()})`).join(', ')}. Repertorio: ${rep}`;
  return `${k+1}. Artista invitado: ${b.nombre||'(sin nombre)'}${b.presenta?`. ${b.presenta}`:''}. Repertorio: ${rep}`;
}).join('\n')}
function historialConceptos(){return S.eds.filter(e=>e!==S.E&&(e.datos.concepto||e.datos.musical)).sort((a,b)=>a.anio-b.anio)
  .map(e=>`- ${e.anio}${e.datos.musical?` (musical: ${e.datos.musical})`:''}: ${e.datos.concepto||'sin descripción'}`).join('\n')}
function promptGuion(i){
  const E=S.E,d=D().dias[i],sig=siguiente(i),pres=d.sinPres?[]:d.pres.map(p=>p.n).filter(Boolean),f=fLarga(fechaDia(E,i));
  return `Eres el guionista de los «${NOMBRE}», la Semana de Santa Cecilia del IES Infanta Elena de Jumilla (Murcia). Escribe el guion que ${d.sinPres?'leerá en voz alta un profesor del departamento (hoy no hay alumnos presentadores)':`leerán en voz alta ${pres.length?`los presentadores ${pres.join(' y ')}`:'dos alumnos presentadores'}`} en el ${d.titulo.toLowerCase()} (${f}), durante el recreo (${D().hora}) en el ${D().lugar}.

Programa${d.sub?` «${d.sub}»`:''}:
${listaBloques(d)||'(todavía sin nada programado)'}

Musical del instituto este curso: ${D().musical||'—'}.
Siguiente concierto: ${sig?`${DIAS[sig.j]}, ${sig.d.titulo}${sig.d.sub?` «${sig.d.sub}»`:''}${sig.d.bloques.length?` con ${sig.d.bloques.map(tituloB).join('; ')}`:''}`:'es el último concierto de la semana'}.

Cómo lo quiero:
1. Introducción breve: bienvenida, Semana de Santa Cecilia (22 de noviembre, patrona de la música) y qué vamos a escuchar hoy.
2. Una presentación por bloque, en este orden, con un dato curioso breve sobre la obra, el autor, el instrumento o el grupo. Usa solo datos ciertos; si dudas, cámbialo por otro sobre el instrumento o el estilo. Si un alumno repite de otros años, menciónalo con cariño.
3. Despedida: agradecimientos, aplauso para los intérpretes y anuncio del siguiente concierto.
4. ${d.sinPres?'Un solo presentador, intervenciones breves.':`Alterna las intervenciones entre ${pres.length==2?`${pres[0]} (P1) y ${pres[1]} (P2)`:'P1 y P2'}.`} Cada intervención debe leerse en menos de 40 segundos: el recreo deja ${D().util||25} minutos de música.
5. Tono cercano, con humor y respetuoso; frases cortas y fáciles de leer en voz alta para alumnado de 12 a 17 años.
6. Formato: encabezados con un emoji (🎙 INTRODUCCIÓN, 1. Nombre – instrumento (curso), 🎙 DESPEDIDA).`;
}
function promptPrograma(i){const d=D().dias[i];
  return `Prepara el texto del programa para el cartel del ${d.titulo.toLowerCase()} de los «${NOMBRE}» (Semana de Santa Cecilia, IES Infanta Elena).
Formato por actuación, en dos líneas:
Nombre(s) (curso – instrumento)
«Obra» (autor)
Para los grupos: el nombre del grupo entre comillas, sus componentes con el instrumento abreviado en una línea y las obras numeradas.
Usa nombres de pila y primer apellido, «&» para unir dos nombres y comas para tres o más. Corrige mayúsculas y tildes de los títulos. No añadas nada más.

Datos:
${listaBloques(d)||'(sin nada programado)'}`}

«Semana de Santa Cecilia» (subtítulo)
«${rango(E)}»
«Recreos · ${D().hora} · ${D().lugar}»
«Alumnos y profesores en concierto»`:`«RECREOS MUSICALES DEL INFANTA» (título)
«${d.titulo}» (subtítulo)
«IES Infanta Elena · ${D().hora}»
«${E.anio}»`;
  return `Diseña un cartel vertical en proporción A4 (210 × 297 mm) para imprimir y colgar en un instituto.

Contexto: es la semana de conciertos en los recreos que el Departamento de Música del IES Infanta Elena (Jumilla) organiza por Santa Cecilia, patrona de la música (22 de noviembre). Tocan alumnos, profesores y artistas invitados.

Texto exacto que debe aparecer, sin faltas de ortografía y sin ningún otro texto:
${textos}

${t=='dia'?'Deja el tercio central del cartel con un fondo liso y sin dibujos, donde yo escribiré después el programa del día.\n\n':''}Santa Cecilia: inspírate en su iconografía (tubos de órgano, rosas, aureola, partituras) con un aire alegre y escolar, de instituto.

Guiño al musical de este curso, «${D().musical||'(escribe aquí el musical)'}»: integra uno o dos símbolos que reconozca quien conozca el musical${D().guinos?` (por ejemplo: ${D().guinos})`:''}. Que sea sutil e ingenioso. No dibujes a los personajes ni uses logotipos o tipografías oficiales.

Tiene que ser original y distinto de los carteles de otros años${h?`, que fueron:\n${h}\nNo repitas esas ideas, esa composición ni el lugar donde iba el guiño.`:'.'}
${D().ideas?`\nIdeas mías para este año: ${D().ideas}\n`:''}
Estilo: ilustración plana de cartel con colores inspirados en el musical, buen contraste, texto legible desde lejos y márgenes limpios para imprimir.${t!='general'?'\nSi te adjunto el cartel general de este año, mantén su estilo, colores y tipografía.':''}`;
}
const promptVales=()=>`Diseña una hoja A4 vertical con 8 vales iguales (2 columnas × 4 filas), separados por líneas discontinuas de corte, a juego con el cartel que te adjunto (mismos colores, tipografía y algún elemento del dibujo).
Texto exacto de cada vale, sin faltas:
«VALE por un desayuno»
«Cantina del IES Infanta Elena»
«Recreos Musicales del INFANTA · Santa Cecilia ${S.E.anio}»
«Nombre: ____________»
Deja espacio en blanco suficiente en la línea del nombre para escribir a mano. Nada más de texto.`;
const promptDiploma=()=>`Diseña el fondo de un diploma en A4 apaisado (297 × 210 mm), a juego con el cartel que te adjunto (mismos colores, tipografía y algún elemento del dibujo).
Texto exacto, solo en la parte superior:
«Diploma de participación»
«Recreos Musicales del INFANTA · Semana de Santa Cecilia ${S.E.anio}»
Deja la franja central completamente lisa y despejada (entre el 35 % y el 75 % de la altura): ahí imprimiré el nombre del alumno, la obra que tocó y una frase de agradecimiento.
Abajo, a la izquierda, «Jumilla, noviembre de ${S.E.anio}», y a la derecha una línea para la firma con «El Departamento de Música» debajo.
Estilo elegante pero alegre, con orla decorativa fina y márgenes limpios para imprimir.`;
function promptActual(){return{guion:()=>promptGuion(S.iaDia),programa:()=>promptPrograma(S.iaDia),cartel:promptCartel,vales:promptVales,diploma:promptDiploma}[S.iaTipo]()}

   <section class="panel"><h3>El musical de este curso</h3>
    <label class="f">Musical<input type="text" value="${esc(D().musical)}" placeholder="Ej.: Descendientes" oninput="setP('musical',this.value);actualizaPrompt()"></label>
    <label class="f" style="margin-top:10px">Símbolos para el guiño<textarea style="min-height:70px" oninput="setP('guinos',this.value);actualizaPrompt()" placeholder="Objetos, colores o motivos reconocibles">${esc(D().guinos)}</textarea></label>
    <label class="f" style="margin-top:10px">Tus ideas para el cartel<textarea style="min-height:70px" oninput="setP('ideas',this.value);actualizaPrompt()">${esc(D().ideas)}</textarea></label>
    <label class="f" style="margin-top:10px">Cartel definitivo de este año, en una frase<textarea style="min-height:70px" oninput="setP('concepto',this.value)" placeholder="Qué se ve y dónde va el guiño. Sirve para no repetirlo el año que viene.">${esc(D().concepto)}</textarea></label></section>
   <section class="panel ia">
    <div class="seg" role="group">${T.map(([k,t])=>`<button aria-pressed="${S.iaTipo==k}" onclick="S.iaTipo='${k}';render()">${t}</button>`).join('')}</div>
    <div class="row" style="margin:12px 0">
     ${S.iaTipo=='guion'||S.iaTipo=='programa'||(S.iaTipo=='cartel'&&S.cartTipo!='general')?`<label class="f" style="width:auto">Día<select onchange="S.iaDia=+this.value;actualizaPrompt()">${opD}</select></label>`:''}
     ${S.iaTipo=='cartel'?`<label class="f" style="width:auto">Tipo de cartel<select onchange="S.cartTipo=this.value;render()">
       <option value="general" ${S.cartTipo=='general'?'selected':''}>General de la semana</option>
       <option value="plantilla" ${S.cartTipo=='plantilla'?'selected':''}>De un día, con el programa integrado después</option>
       <option value="dia" ${S.cartTipo=='dia'?'selected':''}>De un día, con hueco liso para el programa</option></select></label>`:''}</div>
    <textarea id="prompt" aria-label="Encargo para la IA"></textarea>
    <div class="row" style="margin-top:12px">
     ${imagen?`<button class="btn p" onclick="llevarA('gemini')">Copiar y abrir Gemini</button><button class="btn" onclick="llevarA('chatgpt')">Copiar y abrir ChatGPT</button>`
      :`<button class="btn p" onclick="llevarA('claude')">Copiar y abrir Claude</button><button class="btn" onclick="llevarA('gemini')">Gemini</button><button class="btn" onclick="llevarA('chatgpt')">ChatGPT</button>`}
     <button class="btn g" onclick="copiar($('#prompt').value).then(()=>toast('Copiado'))">${ICO.copy}Solo copiar</button></div>
    <p class="sm mu" style="margin:10px 0 0">${imagen?'Gemini (Nano Banana) va muy bien editando sobre una imagen: adjúntale el cartel del año para que los vales y el diploma salgan a juego.':'Puedes retocar el texto antes de copiarlo.'}</p></section>
  </div>`;
}

/* ---------- Estadísticas ---------- */
function apariciones(){ // todas las ediciones
  const r=[];S.eds.forEach(e=>(e.datos.dias||[]).forEach((d,i)=>{if(d.no)return;d.bloques.forEach(b=>{
    const base={anio:e.anio,b};
    if(b.t=='al')b.alumnos.forEach(u=>u.n.trim()&&r.push({...base,rol:'al',n:u.n.trim(),g:u.g,instr:b.instr}));
    if(b.t=='gr'){if(b.coro){if(b.director)r.push({...base,rol:'pr',n:b.director,instr:'Dirección de coro'})}
      else b.comp.forEach(c=>c.n.trim()&&r.push({...base,rol:c.rol,n:c.n.trim(),g:c.g,instr:c.instr}))}
    if(b.t=='in'&&b.nombre)r.push({...base,rol:'in',n:b.nombre,instr:''});
  })}));return r;
}
const SING={voces:'voz',flautas:'flauta',guitarras:'guitarra',saxos:'saxofón',saxofones:'saxofón',saxo:'saxofón',trompetas:'trompeta',violines:'violín',pianos:'piano',teclados:'teclado'};
function instrumentos(t){return String(t||'').split(/,|\/|&|\+|\by\b/i).map(x=>x.replace(/\(.*?\)/g,'').trim().toLowerCase()).filter(Boolean)
  .map(x=>{const w=x.split(' ');w[0]=SING[w[0]]||w[0];return w.join(' ').replace(/^saxofón (alto|tenor|soprano|barítono)s?$/,'saxofón $1')}).map(may)}
function cuenta(arr){const m=new Map();arr.forEach(([k,label])=>{const o=m.get(k)||{label,n:0};o.n++;m.set(k,o)});return[...m.values()].sort((a,b)=>b.n-a.n)}
function barras(lista,max,cls){max=max||Math.max(1,...lista.map(x=>x.n));return lista.map(x=>`<div class="hb"><span>${x.label}</span><span class="b"><i class="${cls||''}" style="width:${x.n/max*100}%"></i></span><span class="n">${x.n}</span></div>`).join('')||'<p class="mu sm">Sin datos todavía.</p>'}
function vStats(){
  const A=apariciones(),años=[...new Set(S.eds.map(e=>e.anio))].sort();
  const al=A.filter(a=>a.rol=='al'),pr=A.filter(a=>a.rol=='pr'),inv=A.filter(a=>a.rol=='in');
  const distintos=x=>new Set(x.map(a=>clave(a.n))).size;
  const blqAl=S.eds.flatMap(e=>e.datos.dias.filter(d=>!d.no).flatMap(d=>d.bloques.filter(b=>b.t=='al')));
  const pb=blqAl.filter(b=>b.formato=='playback').length,ac=blqAl.length-pb;
  // por curso y año
  const porCurso=años.map(y=>{const c={};al.filter(a=>a.anio==y).forEach(a=>{const p=curso(a.g);const k=p?p.niv:'?';c[k]=(c[k]||0)+1});return{y,c}});
  const cur=porCurso.find(p=>p.y==S.E.anio)||{c:{}};const maxC=Math.max(1,...NIVORD.map(k=>cur.c[k]||0));
  const tabla=`<div class="wrap"><table class="sem"><thead><tr><th>Año</th>${NIVORD.map(k=>`<th>${NIV[k]}</th>`).join('')}<th>Sin curso</th></tr></thead><tbody>
    ${porCurso.map(p=>`<tr><td><b>${p.y}</b></td>${NIVORD.map(k=>`<td>${p.c[k]||''}</td>`).join('')}<td>${p.c['?']||''}</td></tr>`).join('')}</tbody></table></div>`;
  const ins=cuenta(A.filter(a=>a.rol!='in').flatMap(a=>instrumentos(a.instr).map(i=>[clave(i),i]))).slice(0,10);
  const top=(x)=>{const m=new Map();x.forEach(a=>{const k=clave(a.n);const o=m.get(k)||{label:esc(a.n),n:0,y:new Set()};o.n++;o.y.add(a.anio);m.set(k,o)});
    return[...m.values()].sort((a,b)=>b.n-a.n||b.y.size-a.y.size).slice(0,10).map(o=>({label:`${o.label} <span class="mu sm">(${[...o.y].sort().join(', ')})</span>`,n:o.n}))};
  const vets=[...new Map(alumnosDe(S.E).map(a=>[clave(a.n),a])).values()].map(a=>({n:a.n,v:vez(a.n)})).filter(x=>x.v>1).sort((a,b)=>b.v-a.v);
  const obras=S.eds.flatMap(e=>e.datos.dias.filter(d=>!d.no).flatMap(d=>d.bloques.flatMap(b=>b.t=='al'?[{o:b.obra,a:b.autor}]:b.rep.map(r=>({o:r.obra,a:r.autor})))));
  const aut=cuenta(obras.filter(x=>x.a&&!/original/i.test(x.a)).map(x=>[clave(x.a),esc(x.a)])).slice(0,10);
  const obr=cuenta(obras.filter(x=>x.o).map(x=>[clave(x.o),esc(x.o)])).filter(x=>x.n>1).slice(0,10);
  return `<h2>Estadísticas</h2><p class="mu" style="margin:0 0 18px">Con todas las ediciones guardadas (${años.join(', ')}). Cuenta cada vez que alguien sube al escenario.</p>
  <div class="big"><div><b>${años.length}</b><span>ediciones</span></div><div><b>${distintos(al)}</b><span>alumnos distintos</span></div><div><b>${distintos(pr)}</b><span>profesores</span></div>
   <div><b>${distintos(inv)}</b><span>artistas invitados</span></div><div><b>${pb}/${ac}</b><span>actuaciones con playback / <i>a cappella</i></span></div></div>
  <div class="grid2">
   <section class="panel"><h3>Alumnos por curso en ${S.E.anio}</h3><div class="cols">${NIVORD.map(k=>`<div class="c"><b>${cur.c[k]||0}</b><i style="height:${(cur.c[k]||0)/maxC*120}px"></i><span>${NIV[k]}</span></div>`).join('')}</div></section>
   <section class="panel"><h3>Por curso, año a año</h3>${tabla}</section>
   <section class="panel"><h3>Veteranos de este año</h3>${vets.length?vets.map(v=>`<div class="hb"><span>${esc(v.n)}</span><span class="b"><i class="o" style="width:${Math.min(100,v.v/Math.max(...vets.map(x=>x.v))*100)}%"></i></span><span class="n">${v.v}.ª</span></div>`).join(''):'<p class="mu sm">Nadie repite todavía de años anteriores.</p>'}</section>
   <section class="panel"><h3>Instrumentos que más suenan</h3>${barras(ins)}</section>
   <section class="panel"><h3>Los alumnos que más tocan</h3>${barras(top(al))}</section>
   <section class="panel"><h3>Los profesores que más tocan</h3>${barras(top(pr),0,'o')}</section>
   <section class="panel"><h3>Autores más interpretados</h3>${barras(aut)}</section>
   <section class="panel"><h3>Obras que se repiten</h3>${obr.length?barras(obr,0,'o'):'<p class="mu sm">Ninguna obra se ha repetido todavía.</p>'}</section>
  </div>`;
}

/* ---------- Historial ---------- */
function vHistorial(){
  return `<div class="row" style="justify-content:space-between;margin-bottom:16px"><div><h2>Historial</h2><p class="mu" style="margin:0">Cada año queda guardado. Los carteles, programas y fotos van en Drive.</p></div>
   <div class="row">${D().driveRaiz?`<a class="btn" href="${esc(D().driveRaiz)}" target="_blank" rel="noopener">${ICO.drive}Carpeta general de Drive</a>`:''}
   <button class="btn p" onclick="nuevaEd()">${ICO.plus}Nueva edición</button></div></div>
  <div class="hist">${S.eds.map(e=>`<article class="panel ${e===S.E?'cur':''}"><span class="yr">${e.anio}</span>
    <b>${esc(e.datos.musical?'Musical: '+e.datos.musical:'Sin musical anotado')}</b>
    <span class="sm mu">${e.datos.dias.reduce((s,d)=>s+(d.no?0:d.bloques.length),0)} bloques · ${new Set(alumnosDe(e).map(a=>clave(a.n))).size} alumnos</span>
    ${e.datos.concepto?`<p class="sm" style="margin:0">${esc(e.datos.concepto)}</p>`:''}
    <div class="row" style="margin-top:auto">${e===S.E?'<span class="tag">Abierta</span>':`<button class="btn" onclick="cambiaEd(${e.anio});S.tab='programa';render()">Abrir</button>`}
     ${e.datos.drive?`<a class="btn" href="${esc(e.datos.drive)}" target="_blank" rel="noopener">${ICO.drive}Drive</a>`:''}
     <button class="btn g" onclick="exportar(${e.anio})">Exportar</button></div></article>`).join('')}</div>
  <section class="panel" style="margin-top:22px"><h3>Copias e importación</h3>
   <p class="sm mu">«Exportar» descarga la edición en un archivo para guardarlo en Drive como copia. «Importar» carga un archivo de otro año. Estos archivos llevan nombres de alumnos: guárdalos en Drive, no en GitHub.</p>
   <label class="btn">Importar archivo<input type="file" accept=".json,application/json" hidden onchange="importar(this)"></label></section>`;
}
function nuevaEd(){const max=Math.max(...S.eds.map(e=>e.anio));
  modal(`<h3>Nueva edición</h3><label class="f">Año<input id="na" type="number" value="${max+1}"></label>
   <p class="sm mu">Se copian la hora, el lugar, la carpeta general de Drive y la frase del diploma. La semana se calcula sola: si el 22 de noviembre cae entre semana, esa semana; si cae en fin de semana, la anterior. Luego puedes cambiarla en Ajustes.</p>
   <div class="row"><button class="btn p" onclick="crearEd(+$('#na').value)">Crear</button><button class="btn" onclick="cerrar()">Cancelar</button></div>`)}
async function crearEd(a){if(!a)return;if(S.eds.some(e=>e.anio==a))return toast('Ya existe la edición '+a,1);
  const e=nuevaEdicion(a,S.E);S.eds.push(e);S.eds.sort((x,y)=>y.anio-x.anio);S.E=e;cerrar();await guardar();S.tab='programa';S.dia=0;render()}
function exportar(a){const e=S.eds.find(x=>x.anio==a);
  const b=new Blob([JSON.stringify({app:'RMI',anio:e.anio,datos:e.datos},null,2)],{type:'application/json'});
  const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`RMI_Santa_Cecilia_${a}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(l.href),2000)}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const j=JSON.parse(r.result);if(!j.anio||!j.datos||!Array.isArray(j.datos.dias))throw new Error('formato');
    normaliza(j.datos);const ex=S.eds.find(e=>e.anio==j.anio);
    const hacer=async()=>{if(ex){ex.datos=j.datos;S.E=ex}else{const e={anio:j.anio,datos:j.datos};S.eds.push(e);S.eds.sort((x,y)=>y.anio-x.anio);S.E=e}
      cerrar();await guardar();toast('Edición '+j.anio+' importada');render()};
    if(ex){window._imp=hacer;modal(`<h3>Ya hay una edición ${j.anio}</h3><p>Si importas, se sustituye por la del archivo.</p><div class="row"><button class="btn p" onclick="_imp()">Sustituir</button><button class="btn" onclick="cerrar()">Cancelar</button></div>`)}
    else hacer();
  }catch(e){toast('El archivo no es una edición de los Recreos Musicales',1)}};r.readAsText(f)}

/* ---------- Ajustes ---------- */
function vAjustes(){
  return `<h2>Ajustes de la edición ${S.E.anio}</h2><p class="mu" style="margin:0 0 18px">Se guardan solos.</p>
  <div class="grid2">
   <section class="panel"><h3>Fechas y lugar</h3>
    <div class="row" style="align-items:end">
     <label class="f" style="flex:1">Curso<input type="text" value="${esc(D().curso)}" oninput="setP('curso',this.value)"></label>
     <label class="f" style="flex:1">Lunes de la semana<input type="date" value="${esc(D().inicio)}" onchange="setP('inicio',this.value,1)"></label></div>
    <p class="sm mu" style="margin:8px 0 0">${esc(rango(S.E))}. <button class="btn g" style="padding:0;color:var(--acc)" onclick="setP('inicio',iso(lunesSantaCecilia(S.E.anio)),1)">Recalcular desde el 22 de noviembre</button></p>
    <div class="row" style="align-items:end;margin-top:10px">
     <label class="f" style="flex:1">Hora<input type="text" value="${esc(D().hora)}" oninput="setP('hora',this.value)"></label>
     <label class="f" style="width:150px">Minutos de música<input type="number" min="5" max="60" value="${esc(D().util)}" onchange="setP('util',Number(this.value)||25)"></label></div>
    <label class="f" style="margin-top:10px">Lugar<input type="text" value="${esc(D().lugar)}" oninput="setP('lugar',this.value)"></label></section>
   <section class="panel"><h3>Drive</h3>
    <label class="f">Carpeta de esta edición<input type="url" value="${esc(D().drive)}" placeholder="https://drive.google.com/…" oninput="setP('drive',this.value)"></label>
    <label class="f" style="margin-top:10px">Carpeta general de Santa Cecilia<input type="url" value="${esc(D().driveRaiz)}" placeholder="https://drive.google.com/…" oninput="setP('driveRaiz',this.value)"></label>
    <div class="row" style="margin-top:10px">${D().drive?`<a class="btn" href="${esc(D().drive)}" target="_blank" rel="noopener">${ICO.drive}Abrir carpeta del año</a>`:''}</div></section>
   <section class="panel"><h3>Sesión</h3><p class="sm">${DEMO?'Modo de prueba: no se guarda nada.':'Has entrado como <b>'+esc(S.user?.email||'')+'</b>.'}</p>
    <button class="btn" onclick="salir()">${DEMO?'Salir de la prueba':'Cerrar sesión'}</button></section>
  </div>`;
}

init();
</script>
<script>(function(){
var DEMO=/[?&]demo\b/.test(location.search);
var U=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'];
function arranca(){var s=document.createElement('script');s.text=document.getElementById('rmi-main').textContent;document.body.appendChild(s)}
function carga(i){if(window.supabase||DEMO)return arranca();if(i>=U.length)return arranca();
 var m=document.getElementById('bootmsg');if(m)m.textContent='Conectando…';
 var s=document.createElement('script'),t=setTimeout(function(){s.onload=s.onerror=null;carga(i+1)},7000);
 s.onload=function(){clearTimeout(t);window.supabase?arranca():carga(i+1)};s.onerror=function(){clearTimeout(t);carga(i+1)};s.src=U[i];document.head.appendChild(s)}
carga(0)})();</script>
</body>
</html>
